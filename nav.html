<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Brommer Nav"/>
<meta name="theme-color" content="#0b0e14"/>
<title>55 km/h Navigatie</title>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin/>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg-glass: rgba(13, 17, 26, 0.92);
    --bg-glass-heavy: rgba(10, 13, 20, 0.96);
    --border-subtle: rgba(255, 255, 255, 0.13);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #3b82f6;
    --accent-bright: #60a5fa;
    --accent-glow: rgba(59, 130, 246, 0.35);
    --green: #10b981;
    --amber: #f59e0b;
    --danger: #ef4444;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0e14;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #map {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #0b0e14;
  }

  .maplibregl-ctrl-bottom-left,
  .maplibregl-ctrl-bottom-right,
  .maplibregl-ctrl-top-left,
  .maplibregl-ctrl-top-right {
    display: none !important;
  }

  .top-stack {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .top-stack > * {
    pointer-events: auto;
  }

  .selector-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 5px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }

  .dir-group {
    display: flex;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    padding: 2px;
    gap: 2px;
  }
  .dir-btn {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 6px 9px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .dir-btn.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 2px 10px var(--accent-glow);
  }

  .bar-divider {
    width: 1px;
    height: 18px;
    background: var(--border-subtle);
    flex-shrink: 0;
  }

  .route-group {
    display: flex;
    flex: 1;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .route-group::-webkit-scrollbar { display: none; }

  .route-pill {
    flex: 1;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 600;
    padding: 6px 7px;
    border-radius: 9px;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .route-pill.active {
    background: rgba(59, 130, 246, 0.22);
    border-color: rgba(96, 165, 250, 0.60);
    color: #ffffff;
    font-weight: 700;
  }

  .maneuver-card {
    background: var(--bg-glass-heavy);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border-subtle);
    border-radius: 18px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 13px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .maneuver-card.imminent {
    border-color: rgba(16, 185, 129, 0.65);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65), 0 0 24px rgba(16, 185, 129, 0.22);
  }

  .turn-icon-box {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: rgba(59, 130, 246, 0.14);
    border: 1px solid rgba(59, 130, 246, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--accent-bright);
    transition: all 0.2s ease;
  }
  .maneuver-card.imminent .turn-icon-box {
    background: rgba(16, 185, 129, 0.18);
    border-color: rgba(16, 185, 129, 0.55);
    color: var(--green);
  }
  .turn-icon-box svg {
    width: 30px;
    height: 30px;
  }

  .turn-body {
    flex: 1;
    min-width: 0;
  }
  .turn-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .turn-dist {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .turn-ActionTag {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent-bright);
    background: rgba(59, 130, 246, 0.15);
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .maneuver-card.imminent .turn-ActionTag {
    color: var(--green);
    background: rgba(16, 185, 129, 0.16);
  }
  .turn-street {
    font-size: 14.5px;
    font-weight: 600;
    color: #e2e8f0;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .turn-meta {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .then-banner {
    align-self: flex-start;
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(13, 17, 26, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle);
    border-radius: 11px;
    padding: 6px 12px;
    margin-top: -2px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  }
  .then-banner.visible {
    display: inline-flex;
  }
  .then-label {
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.05em;
  }

  .offroute-banner {
    background: rgba(239, 68, 68, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 12px;
    text-align: center;
    letter-spacing: 0.02em;
    display: none;
    box-shadow: 0 8px 24px rgba(239, 68, 68, 0.35);
  }

  .map-tools {
    position: absolute;
    right: 12px;
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + 114px);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tool-btn {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--bg-glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
    transition: all 0.15s ease;
  }
  .tool-btn svg {
    width: 19px;
    height: 19px;
  }
  .tool-sub {
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-secondary);
    line-height: 1;
  }
  .tool-btn:active {
    transform: scale(0.94);
  }
  .tool-btn.active {
    background: rgba(59, 130, 246, 0.22);
    border-color: rgba(96, 165, 250, 0.65);
    color: var(--accent-bright);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45), 0 0 14px rgba(59, 130, 246, 0.28);
  }
  .tool-btn.active .tool-sub {
    color: #ffffff;
  }

  .recenter-pill {
    position: absolute;
    left: 12px;
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + 114px);
    z-index: 1000;
    display: none;
    align-items: center;
    gap: 8px;
    background: #2563eb;
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(37, 99, 235, 0.55);
    transition: transform 0.15s ease;
  }
  .recenter-pill.visible {
    display: inline-flex;
  }
  .recenter-pill:active {
    transform: scale(0.95);
  }
  .recenter-pill svg {
    width: 17px;
    height: 17px;
  }

  .bottom-hud {
    position: absolute;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: 12px;
    right: 12px;
    z-index: 1000;
    background: var(--bg-glass-heavy);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border-subtle);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65);
  }

  .progress-track {
    width: 100%;
    height: 3.5px;
    background: rgba(255, 255, 255, 0.08);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3b82f6, #10b981);
    transition: width 0.35s ease;
  }

  .hud-main {
    padding: 11px 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .speed-cluster {
    display: flex;
    align-items: baseline;
    gap: 4px;
    min-width: 74px;
  }
  .speed-val {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .speed-unit {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .metrics-grid {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    justify-content: center;
  }
  .metric-cell {
    text-align: center;
  }
  .metric-val {
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .metric-lbl {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .metric-sep {
    width: 1px;
    height: 24px;
    background: var(--border-subtle);
  }

  .status-cluster {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .gps-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 4px 8px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-secondary);
  }
  .gps-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--amber);
  }
  .gps-badge.locked {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
  }
  .gps-badge.locked .gps-dot {
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
  }
  .wake-lbl {
    font-size: 9px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  .nav-puck-wrap {
    width: 92px;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    will-change: transform;
  }
  .nav-puck-svg {
    width: 92px;
    height: 92px;
    overflow: visible;
    filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.65));
  }

  .turn-target-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    border: 4px solid #3b82f6;
    box-shadow: 0 0 14px rgba(59, 130, 246, 0.9);
    pointer-events: none;
  }

  .endpoint-pin {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2.5px solid #ffffff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="top-stack">
  <div class="selector-bar">
    <div class="dir-group">
      <button class="dir-btn active" id="dir-heen" onclick="setDirection('heen')">HEEN</button>
      <button class="dir-btn" id="dir-terug" onclick="setDirection('terug')">TERUG</button>
    </div>
    <div class="bar-divider"></div>
    <div class="route-group">
      <button class="route-pill active" id="rt-r1" onclick="setRoute('r1')">1. Het Lint (39,6)</button>
      <button class="route-pill" id="rt-r2" onclick="setRoute('r2')">2. Kortst (39,5)</button>
      <button class="route-pill" id="rt-r3" onclick="setRoute('r3')">3. Polder (41,8)</button>
    </div>
  </div>

  <div class="maneuver-card" id="maneuver-card">
    <div class="turn-icon-box" id="turn-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </div>
    <div class="turn-body">
      <div class="turn-top-row">
        <div class="turn-dist" id="turn-dist">39,6 km</div>
        <div class="turn-ActionTag" id="turn-tag">ROUTE 1 · HEEN</div>
      </div>
      <div class="turn-street" id="turn-street">1. Het Lint &amp; De Meernbrug</div>
      <div class="turn-meta" id="turn-meta">HEEN · 4 stoplichten · ~44 min</div>
    </div>
  </div>

  <div class="then-banner" id="then-banner">
    <span class="then-label">Daarna</span>
    <span id="then-icon"></span>
    <span id="then-text">rechtdoor</span>
  </div>

  <div class="offroute-banner" id="offroute-banner">
    Van route afgeweken
  </div>
</div>

<button class="recenter-pill visible" id="recenter-pill" onclick="engageNavigation()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 19 21 12 17 5 21 12 2"/>
  </svg>
  <span id="recenter-label">Start Navigatie</span>
</button>

<div class="map-tools">
  <button class="tool-btn active" id="btn-compass" onclick="toggleCourseUp()" title="Koers boven / Noord boven">
    <svg id="compass-needle" viewBox="0 0 24 24" fill="none" style="will-change: transform;">
      <polygon points="12,2.5 15.5,12 12,10.2 8.5,12" fill="#ef4444"/>
      <polygon points="12,21.5 15.5,12 12,13.8 8.5,12" fill="#cbd5e1"/>
    </svg>
    <span class="tool-sub" id="lbl-compass">3D KOERS</span>
  </button>

  <button class="tool-btn" id="btn-follow" onclick="engageNavigation()" title="Centreer op gps">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="7"/>
      <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
      <line x1="12" y1="2" x2="12" y2="5"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="5" y2="12"/>
      <line x1="19" y1="12" x2="22" y2="12"/>
    </svg>
    <span class="tool-sub">CENTREER</span>
  </button>

  <button class="tool-btn active" id="btn-overview" onclick="fitFullRoute(true)" title="Hele route tonen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 3 21 3 21 9"/>
      <polyline points="9 21 3 21 3 15"/>
      <line x1="21" y1="3" x2="14" y2="10"/>
      <line x1="3" y1="21" x2="10" y2="14"/>
    </svg>
    <span class="tool-sub">OVERZICHT</span>
  </button>

  <button class="tool-btn" id="btn-theme" onclick="toggleMapTheme()" title="Wissel Dag / Nacht kaart">
    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
    <span class="tool-sub" id="lbl-theme">DAGKAART</span>
  </button>

  <a class="tool-btn" id="btn-gmaps" href="#" target="_blank" rel="noopener" title="Open in Google Maps">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7z"/>
      <circle cx="12" cy="9" r="2.5"/>
    </svg>
    <span class="tool-sub">MAPS</span>
  </a>
</div>

<div class="bottom-hud">
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <div class="hud-main">
    <div class="speed-cluster">
      <span class="speed-val" id="speed-val">0</span>
      <span class="speed-unit">km/h</span>
    </div>
    <div class="metrics-grid">
      <div class="metric-cell">
        <div class="metric-val" id="rem-dist">39,6 km</div>
        <div class="metric-lbl">Resterend</div>
      </div>
      <div class="metric-sep"></div>
      <div class="metric-cell">
        <div class="metric-val" id="rem-time">44 min</div>
        <div class="metric-lbl">Rijtijd</div>
      </div>
      <div class="metric-sep"></div>
      <div class="metric-cell">
        <div class="metric-val" id="eta-time">--:--</div>
        <div class="metric-lbl">Aankomst</div>
      </div>
    </div>
    <div class="status-cluster">
      <div class="gps-badge" id="gps-badge">
        <span class="gps-dot"></span>
        <span id="gps-text">ZOEK GPS</span>
      </div>
      <div class="wake-lbl" id="wake-lbl">KOMPAS + GPS</div>
    </div>
  </div>
</div>

<script>
const ROUTE_META = {
  r1: { short: "ROUTE 1", lights: "4 stoplichten", mins: 44, color: "#3b82f6", core: "#60a5fa" },
  r2: { short: "ROUTE 2", lights: "13 stoplichten", mins: 43, color: "#10b981", core: "#34d399" },

const params = new URLSearchParams(window.location.search);
if (params.get("route") && ["r1", "r2", "r3"].includes(params.get("route"))) {
  curRoute = params.get("route");
}
if (params.get("dir") && ["heen", "terug"].includes(params.get("dir"))) {
  curDir = params.get("dir");
}

function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function calcBearing(lat1, lon1, lat2, lon2) {
  const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function offsetLngLatMeters(lng, lat, bearingDeg, meters) {
  const brng = toRad(bearingDeg);
  const dLat = (meters * Math.cos(brng)) / 111320;
  const dLng = (meters * Math.sin(brng)) / (111320 * Math.max(0.2, Math.cos(toRad(lat))));
  return [lng + dLng, lat + dLat];
}

function angleDiff(from, to) {
  return ((to - from + 540) % 360) - 180;
}
function lerpAngle(from, to, t) {
  return (from + angleDiff(from, to) * t + 360) % 360;
}

function cardinalFromDeg(deg) {
  const dirs = ["N", "NO", "O", "ZO", "Z", "ZW", "W", "NW"];
  return dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
}

function createPuckElement() {

  wrap.className = "nav-puck-wrap";

function initMap() {
  ["r1", "r2", "r3"].forEach(k => {
    document.getElementById("rt-" + k).classList.toggle("active", k === curRoute);
  });
  ["heen", "terug"].forEach(d => {
    document.getElementById("dir-" + d).classList.toggle("active", d === curDir);
  });

  map = new maplibregl.Map({
    container: "map",
    style: UNIFIED_MAP_STYLE,
    center: [4.96, 52.175],
    zoom: 10.6,
    pitch: 0,
    bearing: 0,
    attributionControl: false,
    dragRotate: true,
    touchPitch: true,
    maxPitch: 65,
    fadeDuration: 0
  });

  const onUserGestureStart = (e) => {
    if (e && e.originalEvent) {
      isDragging = true;
      if (followUser) {
        followUser = false;
        updateControlStates();
      }
    }
  };
  const onUserGestureEnd = () => {
    isDragging = false;
  };

  map.on("dragstart", onUserGestureStart);
  map.on("rotatestart", onUserGestureStart);
  map.on("pitchstart", onUserGestureStart);
  map.on("dragend", onUserGestureEnd);
  map.on("rotateend", onUserGestureEnd);
  map.on("pitchend", onUserGestureEnd);

  map.on("rotate", () => {
    const b = map.getBearing();
    const needle = document.getElementById("compass-needle");
    if (needle) {
      needle.style.transform = `rotate(${-b}deg)`;
    }
    const lbl = document.getElementById("lbl-compass");
    if (lbl) {
      lbl.textContent = courseUp ? `3D · ${cardinalFromDeg(b)}` : "2D NOORD";
    }
  });

  map.on("load", () => {
    if (NAV_DATA) {
      renderSelectedRoute(true);
    }
  });

  document.addEventListener("click", () => {
    requestCompassPermission();
    requestWakeLock();
  }, { once: true });

  fetch("nav_routes.json?v=6")
    .then(r => r.json())
    .then(data => {
      NAV_DATA = data;
      renderSelectedRoute(true);
      startGpsTracking();
      initCompassListener();
      lastFrameTime = performance.now();
      requestAnimationFrame(cameraLoop);
    });
}

function setTurnMarkerAt(lon, lat) {
  if (!map) return;
  if (!turnMarker) {
    const dotEl = document.createElement("div");
    dotEl.className = "turn-target-dot";
    turnMarker = new maplibregl.Marker({ element: dotEl })
      .setLngLat([lon, lat])
      .addTo(map);
  } else {
    turnMarker.setLngLat([lon, lat]);
  }
}

function updateStaticRouteLayers() {
  if (!map || !NAV_DATA) return;
  const meta = ROUTE_META[curRoute] || ROUTE_META.r1;
  if (map.getLayer("route-ahead-glow")) {
    map.setPaintProperty("route-ahead-glow", "line-color", meta.color);
    map.setPaintProperty("route-ahead-casing", "line-color", meta.color);
    map.setPaintProperty("route-ahead-core", "line-color", meta.core);
  }

  const srcAlt = map.getSource("alt-routes");
  if (srcAlt) {
    const altFeatures = [];
    ["r1", "r2", "r3"].forEach(k => {
      if (k !== curRoute && NAV_DATA[k] && NAV_DATA[k][curDir]) {
        altFeatures.push({
          type: "Feature",
          geometry: {
            type: "LineString",
            coordinates: NAV_DATA[k][curDir].coords.map(c => [c[1], c[0]])
          }
        });
      }
    });
    srcAlt.setData({ type: "FeatureCollection", features: altFeatures });
  }
}

function updateRouteProgressGeoJSON(force = false) {
  if (!map || !routeCoordsLngLat.length) return;
  if (!force && currentSplitIdx === lastRenderedSplitIdx) return;
  const srcAhead = map.getSource("route-ahead");
  const srcTraveled = map.getSource("route-traveled");
  if (!srcAhead || !srcTraveled) return;

  lastRenderedSplitIdx = currentSplitIdx;
  const split = Math.max(0, Math.min(currentSplitIdx, routeCoordsLngLat.length - 1));
  const traveledCoords = routeCoordsLngLat.slice(0, split + 1);
  const aheadCoords = routeCoordsLngLat.slice(split);

  srcTraveled.setData({
    type: "Feature",
    geometry: {
      type: "LineString",
      coordinates: traveledCoords.length >= 2 ? traveledCoords : [routeCoordsLngLat[0], routeCoordsLngLat[0]]
    }
  });

  srcAhead.setData({
    type: "Feature",
    geometry: {
      type: "LineString",
      coordinates: aheadCoords.length >= 2 ? aheadCoords : routeCoordsLngLat
    }
  });
}

function setDirection(dir) {
  curDir = dir;
  document.getElementById("dir-heen").classList.toggle("active", dir === "heen");
  document.getElementById("dir-terug").classList.toggle("active", dir === "terug");
  routeSwitchBannerUntil = Date.now() + 2800;
  renderSelectedRoute(!followUser);
}

function setRoute(rKey) {
  curRoute = rKey;
  ["r1", "r2", "r3"].forEach(k => {
    document.getElementById("rt-" + k).classList.toggle("active", k === rKey);
  });
  routeSwitchBannerUntil = Date.now() + 2800;
  renderSelectedRoute(!followUser);
}

function renderSelectedRoute(shouldFitBounds) {
  if (!NAV_DATA || !NAV_DATA[curRoute]) return;
  const routeObj = NAV_DATA[curRoute];
  const rData = routeObj[curDir];
  if (!rData) return;

  const gmapsBtn = document.getElementById("btn-gmaps");
  if (gmapsBtn) {
    gmapsBtn.href = curDir === "heen" ? routeObj.gmaps_heen : routeObj.gmaps_terug;
  }

  routeCoordsLatLon = rData.coords || [];
  routeCoordsLngLat = routeCoordsLatLon.map(c => [c[1], c[0]]);
  currentSplitIdx = 0;
  lastRenderedSplitIdx = -1;

  cumDist = new Array(routeCoordsLatLon.length).fill(0);
  for (let i = 1; i < routeCoordsLatLon.length; i++) {
    cumDist[i] = cumDist[i - 1] + haversine(
      routeCoordsLatLon[i - 1][0], routeCoordsLatLon[i - 1][1],
      routeCoordsLatLon[i][0], routeCoordsLatLon[i][1]
    );
  }
  totalRouteMeters = cumDist[cumDist.length - 1] || ((rData.distance_km || 39.6) * 1000);

  const steps = rData.steps || [];
  let searchFrom = 0;
  for (let s = 0; s < steps.length; s++) {
    const st = steps[s];
    let bestI = searchFrom;
    let bestD = Infinity;
    const limitI = Math.min(routeCoordsLatLon.length, searchFrom + 350);
    for (let i = searchFrom; i < limitI; i++) {
      const d = haversine(st.lat, st.lon, routeCoordsLatLon[i][0], routeCoordsLatLon[i][1]);
      if (d < bestD) {
        bestD = d;
        bestI = i;
      }
    }
    st._ptIdx = bestI;
    searchFrom = bestI;
  }

  if (routeCoordsLatLon.length > 5 && compassHeading === null && gpsHeading === null) {
    targetHeading = calcBearing(
      routeCoordsLatLon[0][0], routeCoordsLatLon[0][1],
      routeCoordsLatLon[5][0], routeCoordsLatLon[5][1]
    );
    displayHeading = targetHeading;
  }

  updateHudForSelectedRoute(routeObj, rData);
  updateStaticRouteLayers();
  updateRouteProgressGeoJSON(true);

  if (steps.length > 1) {
    setTurnMarkerAt(steps[1].lon, steps[1].lat);
  } else if (steps.length === 1) {
    setTurnMarkerAt(steps[0].lon, steps[0].lat);
  }

  if (map && routeCoordsLngLat.length > 1) {
    if (startMarker) startMarker.remove();
    if (endMarker) endMarker.remove();

    const startEl = document.createElement("div");
    startEl.className = "endpoint-pin";
    startEl.style.background = "#10b981";
    startMarker = new maplibregl.Marker({ element: startEl })
      .setLngLat(routeCoordsLngLat[0])
      .addTo(map);

    const endEl = document.createElement("div");
    endEl.className = "endpoint-pin";
    endEl.style.background = "#ef4444";
    endMarker = new maplibregl.Marker({ element: endEl })
      .setLngLat(routeCoordsLngLat[routeCoordsLngLat.length - 1])
      .addTo(map);

    if (shouldFitBounds) {
      fitFullRoute(false);
    }
  }

  if (targetLngLat && followUser) {
    processLocationUpdate(targetLngLat[1], targetLngLat[0], lastSpeedMps, gpsHeading);
  }
}

function updateHudForSelectedRoute(routeObj, rData) {
  const meta = ROUTE_META[curRoute] || ROUTE_META.r1;
  const distKm = rData.distance_km || (totalRouteMeters / 1000);
  const remKmStr = distKm.toFixed(1).replace(".", ",");
  const mins = meta.mins || Math.round((distKm / 52.0) * 60);

  document.getElementById("rem-dist").textContent = remKmStr + " km";
  document.getElementById("rem-time").textContent = mins + " min";
  const eta = new Date(Date.now() + mins * 60000);
  document.getElementById("eta-time").textContent =
    String(eta.getHours()).padStart(2, "0") + ":" + String(eta.getMinutes()).padStart(2, "0");
  document.getElementById("progress-fill").style.width = "0%";

  const dirLabel = curDir === "heen" ? "HEEN · WESTWIJK → UTRECHT" : "TERUG · UTRECHT → WESTWIJK";
  document.getElementById("turn-dist").textContent = remKmStr + " km";
  document.getElementById("turn-tag").textContent = `${meta.short} · ${curDir.toUpperCase()}`;
  document.getElementById("turn-street").textContent = routeObj.title;
  document.getElementById("turn-meta").textContent = `${dirLabel} · ${meta.lights} · ~${mins} min`;
  document.getElementById("turn-icon").innerHTML = getTurnSvg("straight", "depart", 30);
  document.getElementById("then-banner").classList.remove("visible");
}

function fitFullRoute(userClickedOverview = true) {
  if (!map || !routeCoordsLngLat.length) return;
  if (userClickedOverview) {
    followUser = false;
    updateControlStates();
    if (NAV_DATA && NAV_DATA[curRoute]) {
      updateHudForSelectedRoute(NAV_DATA[curRoute], NAV_DATA[curRoute][curDir]);
    }
  }
  const bounds = new maplibregl.LngLatBounds(routeCoordsLngLat[0], routeCoordsLngLat[0]);
  for (const pt of routeCoordsLngLat) bounds.extend(pt);
  isEasing = true;
  map.fitBounds(bounds, {
    padding: { top: 205, bottom: 125, left: 38, right: 74 },
    pitch: 0,
    bearing: 0,
    duration: 600
  });
  setTimeout(() => { isEasing = false; }, 630);
}

function engageNavigation() {
  requestCompassPermission();
  requestWakeLock();
  followUser = true;
  routeSwitchBannerUntil = 0;
  updateControlStates();

  if (targetLngLat && map) {
    processLocationUpdate(targetLngLat[1], targetLngLat[0], lastSpeedMps, gpsHeading);
    const camCenter = courseUp
      ? offsetLngLatMeters(targetLngLat[0], targetLngLat[1], displayHeading, 42)
      : targetLngLat;
    isEasing = true;
    map.easeTo({
      center: camCenter,
      zoom: courseUp ? displayZoom : 15.6,
      pitch: courseUp ? 56 : 0,
      bearing: courseUp ? displayHeading : 0,
      duration: 550
    });
    setTimeout(() => { isEasing = false; }, 580);
  } else if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      onGpsPos(pos);
      if (targetLngLat && map) {
        const camCenter = courseUp
          ? offsetLngLatMeters(targetLngLat[0], targetLngLat[1], displayHeading, 42)
          : targetLngLat;
        isEasing = true;
        map.easeTo({
          center: camCenter,
          zoom: courseUp ? displayZoom : 15.6,
          pitch: courseUp ? 56 : 0,
          bearing: courseUp ? displayHeading : 0,
          duration: 550
        });
        setTimeout(() => { isEasing = false; }, 580);
      }
    }, onGpsErr, {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 8000
    });
  }
}

function toggleCourseUp() {
  requestCompassPermission();
  courseUp = !courseUp;
  followUser = true;
  updateControlStates();

  const rawCenter = targetLngLat || (routeCoordsLngLat.length ? routeCoordsLngLat[0] : [4.82693, 52.28640]);
  const camCenter = courseUp
    ? offsetLngLatMeters(rawCenter[0], rawCenter[1], displayHeading, 42)
    : rawCenter;
  if (map) {
    isEasing = true;
    map.easeTo({
      center: camCenter,
      zoom: courseUp ? displayZoom : 15.4,
      pitch: courseUp ? 56 : 0,
      bearing: courseUp ? displayHeading : 0,
      duration: 500
    });
    setTimeout(() => { isEasing = false; }, 530);
  }
}

function toggleMapTheme() {
  lightTheme = !lightTheme;
  if (map) {
    const layers = map.getStyle().layers || [];
    for (let i = 0; i < layers.length; i++) {
      const id = layers[i].id;
      if (id.startsWith("dark-")) {
        map.setLayoutProperty(id, "visibility", lightTheme ? "none" : "visible");
      } else if (id.startsWith("light-")) {
        map.setLayoutProperty(id, "visibility", lightTheme ? "visible" : "none");
      }
    }
  }
  document.getElementById("btn-theme").classList.toggle("active", lightTheme);
  document.getElementById("lbl-theme").textContent = lightTheme ? "NACHTKAART" : "DAGKAART";
}

function updateControlStates() {
  document.getElementById("btn-follow").classList.toggle("active", followUser);
  document.getElementById("btn-overview").classList.toggle("active", !followUser);
  document.getElementById("btn-compass").classList.toggle("active", courseUp);
  document.getElementById("lbl-compass").textContent = courseUp
    ? `3D · ${cardinalFromDeg(displayHeading)}`
    : "2D NOORD";

  const pill = document.getElementById("recenter-pill");
  const label = document.getElementById("recenter-label");
  if (!followUser) {
    pill.classList.add("visible");
    label.textContent = "Start Navigatie";
  } else if (!compassGranted && typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    pill.classList.add("visible");
    label.textContent = "Activeer Kompas";
  } else {
    pill.classList.remove("visible");
  }
}

function requestCompassPermission() {
  if (compassGranted) return;
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission()
      .then(state => {
        if (state === "granted") {
          compassGranted = true;
          window.addEventListener("deviceorientation", onDeviceOrientation, true);
          updateControlStates();
        }
      })
      .catch(() => {});
  } else {
    compassGranted = true;
    updateControlStates();
  }
}

function initCompassListener() {
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission !== "function") {
    compassGranted = true;
    if ("ondeviceorientationabsolute" in window) {
      window.addEventListener("deviceorientationabsolute", onDeviceOrientation, true);
    } else {
      window.addEventListener("deviceorientation", onDeviceOrientation, true);
    }
  }
  updateControlStates();
}

function onDeviceOrientation(e) {
  let hdg = null;
  if (typeof e.webkitCompassHeading === "number" && !isNaN(e.webkitCompassHeading)) {
    hdg = e.webkitCompassHeading;
  } else if (typeof e.alpha === "number" && !isNaN(e.alpha)) {
    const screenAngle = (screen.orientation && typeof screen.orientation.angle === "number")
      ? screen.orientation.angle
      : (typeof window.orientation === "number" ? window.orientation : 0);
    hdg = (360 - e.alpha + screenAngle) % 360;
  }
  if (hdg === null) return;

  const cleanHdg = (hdg + 360) % 360;
  compassHeading = compassHeading === null ? cleanHdg : lerpAngle(compassHeading, cleanHdg, 0.22);
  compassGranted = true;

  // Below walking speed (1.8 m/s = 6.5 km/h), update heading smoothly from low-pass filtered compass
  if (lastSpeedMps < 1.8 && gpsHeading === null) {
    targetHeading = compassHeading;
  }
}

function cameraLoop(now) {
  const dt = Math.min(0.1, Math.max(0.004, (now - lastFrameTime) / 1000));
  lastFrameTime = now;
  const alphaPos = 1 - Math.exp(-dt * 10.5);
  const alphaHdg = 1 - Math.exp(-dt * 9.0);
  const alphaZoom = 1 - Math.exp(-dt * 3.5);

  if (targetLngLat) {
    if (!displayLngLat) {
      displayLngLat = [targetLngLat[0], targetLngLat[1]];
    } else {
      displayLngLat[0] += (targetLngLat[0] - displayLngLat[0]) * alphaPos;
      displayLngLat[1] += (targetLngLat[1] - displayLngLat[1]) * alphaPos;
    }

    displayHeading = lerpAngle(displayHeading, targetHeading, alphaHdg);
    displayZoom += (targetZoom - displayZoom) * alphaZoom;

    if (userMarker) {
      userMarker.setLngLat(displayLngLat);
      userMarker.setRotation(displayHeading);
    }

    if (followUser && !isDragging && !isEasing && map) {
      // Offset camera ahead of rider in 3D Course-Up mode so rider puck sits in lower 1/3 of screen
      const lookAheadMeters = courseUp ? 42 : 0;
      const camCenter = courseUp
        ? offsetLngLatMeters(displayLngLat[0], displayLngLat[1], displayHeading, lookAheadMeters)
        : displayLngLat;

      map.jumpTo({
        center: camCenter,
        zoom: courseUp ? displayZoom : map.getZoom(),
        bearing: courseUp ? displayHeading : 0,
        pitch: courseUp ? 56 : 0
      });
    }
  }
  requestAnimationFrame(cameraLoop);
}

function getTurnSvg(mod, type, size = 30) {
  const m = mod || "";
  const t = type || "";
  let path = `<path d="M12 19V5M5 12l7-7 7 7"/>`;
  if (t === "arrive") {
    path = `<circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 6.9 8 11.7z"/>`;
  } else if (t === "roundabout" || t === "rotary") {
    path = `<circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 16v6M16 12h6"/>`;
  } else if (m.includes("left")) {
    path = m.includes("slight")
      ? `<path d="M17 19V9l-7-5"/><path d="M10 9V4h5"/>`
      : `<path d="M18 19v-7a3 3 0 0 0-3-3H5"/><path d="M9 5 5 9l4 4"/>`;
  } else if (m.includes("right")) {
    path = m.includes("slight")
      ? `<path d="M7 19V9l7-5"/><path d="M14 9V4H9"/>`
      : `<path d="M6 19v-7a3 3 0 0 1 3-3h10"/><path d="m15 5 4 4-4 4"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}

function getActionTag(step) {
  if (!step) return "VOLG ROUTE";
  const mod = step.mod || "";
  const type = step.type || "";
  if (type === "arrive") return "BESTEMMING";
  if (type === "roundabout" || type === "rotary") return "ROTONDE";
  if (mod === "sharp left") return "SCHERP LINKS";
  if (mod === "left") return "LINKSAF";
  if (mod === "slight left") return "LINKS AANHOUDEN";
  if (mod === "sharp right") return "SCHERP RECHTS";
  if (mod === "right") return "RECHTSAF";
  if (mod === "slight right") return "RECHTS AANHOUDEN";
  return "RECHTDOOR";
}

function formatStepDutch(step) {
  if (!step) return "Volg de route";
  const mod = step.mod || "";
  const type = step.type || "";
  const name = step.name || "Fietspad / Weg";
  if (type === "arrive") return "Bestemming bereikt";
  if (type === "roundabout" || type === "rotary") return `Rotonde op naar ${name}`;
  if (mod === "sharp left") return `Scherp linksaf naar ${name}`;
  if (mod === "left") return `Linksaf naar ${name}`;
  if (mod === "slight left") return `Links aanhouden op ${name}`;
  if (mod === "sharp right") return `Scherp rechtsaf naar ${name}`;
  if (mod === "right") return `Rechtsaf naar ${name}`;
  if (mod === "slight right") return `Rechts aanhouden op ${name}`;
  return `Weg volgen op ${name}`;
}

function formatDist(m) {
  if (m >= 1000) return (m / 1000).toFixed(1).replace(".", ",") + " km";
  if (m >= 100) return Math.round(m / 10) * 10 + " m";
  return Math.max(5, Math.round(m / 5) * 5) + " m";
}

function setManeuverUI(step, nextStep, distToStep, gapToNext, routeTitle) {
  if (!step) return;
  const meta = ROUTE_META[curRoute] || ROUTE_META.r1;
  if (Date.now() < routeSwitchBannerUntil) {
    document.getElementById("turn-meta").textContent = `${routeTitle} · ${meta.lights}`;
    return;
  }
  document.getElementById("turn-dist").textContent = formatDist(distToStep);
  document.getElementById("turn-tag").textContent = `${getActionTag(step)} · ${meta.short}`;
  document.getElementById("turn-street").textContent = formatStepDutch(step);
  document.getElementById("turn-meta").textContent = `${routeTitle} · ${meta.lights}`;
  document.getElementById("turn-icon").innerHTML = getTurnSvg(step.mod || "", step.type || "", 30);

  const card = document.getElementById("maneuver-card");
  card.classList.toggle("imminent", distToStep <= 140);

  const thenBanner = document.getElementById("then-banner");
  if (nextStep && distToStep <= 500 && gapToNext <= 450) {
    thenBanner.classList.add("visible");
    document.getElementById("then-icon").innerHTML = getTurnSvg(nextStep.mod || "", nextStep.type || "", 15);
    document.getElementById("then-text").textContent = formatStepDutch(nextStep);
  } else {
    thenBanner.classList.remove("visible");
  }
}

function startGpsTracking() {
  if (!navigator.geolocation) {
    document.getElementById("gps-text").textContent = "GEEN GPS";
    return;
  }
  navigator.geolocation.watchPosition(onGpsPos, onGpsErr, {
    enableHighAccuracy: true,
    maximumAge: 500,
    timeout: 10000
  });
}

function onGpsPos(pos) {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const spdMps = pos.coords.speed || 0;
  const hdg = pos.coords.heading;

  const isFirst = (targetLngLat === null);
  lastSpeedMps = spdMps;

  // Derive true GPS movement course from hardware heading or position delta (>= 3.5m)
  if (hdg !== null && !isNaN(hdg) && spdMps >= 1.8) {
    gpsHeading = (hdg + 360) % 360;
    prevMoveLatLon = [lat, lon];
  } else if (prevMoveLatLon) {
    const movedM = haversine(prevMoveLatLon[0], prevMoveLatLon[1], lat, lon);
    if (movedM >= 3.5) {
      gpsHeading = calcBearing(prevMoveLatLon[0], prevMoveLatLon[1], lat, lon);
      prevMoveLatLon = [lat, lon];
    }
  } else {
    prevMoveLatLon = [lat, lon];
  }

  targetLngLat = [lon, lat];
  if (!displayLngLat) displayLngLat = [lon, lat];

  if (!userMarker && map) {
    const el = createPuckElement();
    userMarker = new maplibregl.Marker({
      element: el,
      rotationAlignment: "map",
      pitchAlignment: "map"
    })
      .setLngLat([lon, lat])
      .setRotation(displayHeading)
      .addTo(map);
  }

  const badge = document.getElementById("gps-badge");
  badge.classList.add("locked");
  document.getElementById("gps-text").textContent = "GPS ACTIEF";

  const kmh = Math.max(0, Math.round(spdMps * 3.6));
  document.getElementById("speed-val").textContent = kmh;

  // Speed-adaptive zoom: closer in town (17.0), wider lookahead at 55 km/h (16.15)
  if (kmh >= 42) {
    targetZoom = 16.15;
  } else if (kmh >= 22) {
    targetZoom = 16.55;
  } else {
    targetZoom = 16.95;
  }

  if (isFirst && NAV_DATA && !params.get("dir")) {
    const dHome = haversine(lat, lon, 52.28640, 4.82693);
    const dWork = haversine(lat, lon, 52.06360, 5.10770);
    if (dWork < 1500 && curDir !== "terug") {
      setDirection("terug");
    } else if (dHome < 1500 && curDir !== "heen") {
      setDirection("heen");
    }
  }

  if (!followUser && kmh >= 6) {
    followUser = true;
    updateControlStates();
  }

  if (followUser || isFirst) {
    processLocationUpdate(lat, lon, spdMps, gpsHeading);
  }
}

function processLocationUpdate(lat, lon, spdMps, hdg) {
  if (!NAV_DATA || !routeCoordsLatLon.length) return;
  const routeObj = NAV_DATA[curRoute];
  const rData = routeObj[curDir];
  const kmh = Math.max(0, Math.round(spdMps * 3.6));

  let bestIdx = 0;
  let bestDist = Infinity;
  for (let i = 0; i < routeCoordsLatLon.length; i++) {
    const d = haversine(lat, lon, routeCoordsLatLon[i][0], routeCoordsLatLon[i][1]);
    if (d < bestDist) {
      bestDist = d;
      bestIdx = i;
    }
  }

  if (bestDist < 1500 && bestIdx < routeCoordsLatLon.length - 5) {
    currentSplitIdx = bestIdx;
  } else {
    currentSplitIdx = 0;
  }
  updateRouteProgressGeoJSON(false);

  // Compute physical 28-meter road lookahead bearing along the route polyline
  let roadBearing = targetHeading;
  if (currentSplitIdx < routeCoordsLatLon.length - 1) {
    const curM = cumDist[currentSplitIdx] || 0;
    const targetM = curM + 28;
    let lookIdx = currentSplitIdx + 1;
    while (lookIdx < routeCoordsLatLon.length - 1 && cumDist[lookIdx] < targetM) {
      lookIdx++;
    }
    roadBearing = calcBearing(
      routeCoordsLatLon[currentSplitIdx][0], routeCoordsLatLon[currentSplitIdx][1],
      routeCoordsLatLon[lookIdx][0], routeCoordsLatLon[lookIdx][1]
    );
  }

  // Fuse GPS movement course, 28m road tangent lookahead, and filtered magnetic compass
  if (spdMps >= 1.8 && hdg !== null && !isNaN(hdg)) {
    const alignedWithRoute = bestDist < 38 && Math.abs(angleDiff(hdg, roadBearing)) < 65;
    targetHeading = alignedWithRoute ? lerpAngle(hdg, roadBearing, 0.38) : hdg;
  } else if (bestDist < 32 && spdMps >= 0.4) {
    targetHeading = roadBearing;
  } else if (compassHeading !== null) {
    targetHeading = bestDist < 28 ? lerpAngle(compassHeading, roadBearing, 0.35) : compassHeading;
  } else {
    targetHeading = roadBearing;
  }

  if (!followUser) return;

  document.getElementById("offroute-banner").style.display = bestDist > 110 ? "block" : "none";

  const traveledM = cumDist[currentSplitIdx] || 0;
  const remMeters = Math.max(0, totalRouteMeters - traveledM);
  const pct = Math.min(100, Math.max(0, (traveledM / Math.max(1, totalRouteMeters)) * 100));
  document.getElementById("progress-fill").style.width = pct.toFixed(1) + "%";

  const remKm = (remMeters / 1000).toFixed(1).replace(".", ",");
  const effSpeedKmh = kmh > 18 ? Math.min(56, Math.max(25, kmh * 0.92)) : 52.0;
  const remMins = Math.max(1, Math.round((remMeters / 1000) / effSpeedKmh * 60));

  document.getElementById("rem-dist").textContent = remKm + " km";
  document.getElementById("rem-time").textContent = remMins + " min";
  const eta = new Date(Date.now() + remMins * 60000);
  document.getElementById("eta-time").textContent =
    String(eta.getHours()).padStart(2, "0") + ":" + String(eta.getMinutes()).padStart(2, "0");

  const steps = rData.steps || [];
  let nextStep = steps[steps.length - 1] || null;
  let secondStep = null;
  let distToNext = remMeters;
  let gapToSecond = 9999;

  for (let s = 0; s < steps.length; s++) {
    const st = steps[s];
    if (st.type === "depart") continue;
    const stMeters = (typeof st._ptIdx === "number" && cumDist[st._ptIdx] !== undefined)
      ? cumDist[st._ptIdx]
      : (st.cum || 0);
    const dAlong = stMeters - traveledM;
    if (dAlong > 12) {
      nextStep = st;
      distToNext = dAlong;
      if (s + 1 < steps.length) {
        secondStep = steps[s + 1];
        gapToSecond = st.dist || 9999;
      }
      break;
    }
  }

  if (nextStep) {
    setManeuverUI(nextStep, secondStep, distToNext, gapToSecond, routeObj.title);
    setTurnMarkerAt(nextStep.lon, nextStep.lat);
  }
}

function onGpsErr() {
  const badge = document.getElementById("gps-badge");
  badge.classList.remove("locked");
  document.getElementById("gps-text").textContent = "GPS WACHT";
}

async function requestWakeLock() {
  if ("wakeLock" in navigator) {
    try {
      await navigator.wakeLock.request("screen");
      document.getElementById("wake-lbl").textContent = "SCHERM BLIJFT AAN";
    } catch (e) {}
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});

window.addEventListener("DOMContentLoaded", () => {
  initMap();
  requestWakeLock();
});
</script>
</body>
