<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Brommer Nav"/>
<meta name="theme-color" content="#0b0d11"/>
<title>Brommer Cockpit — 55 km/h Navigatie</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg-glass: rgba(13, 16, 23, 0.90);
    --bg-glass-heavy: rgba(10, 12, 18, 0.95);
    --bg-elevated: rgba(255, 255, 255, 0.06);
    --border-subtle: rgba(255, 255, 255, 0.11);
    --border-strong: rgba(255, 255, 255, 0.20);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #3b82f6;
    --accent-bright: #60a5fa;
    --accent-glow: rgba(59, 130, 246, 0.35);
    --green: #10b981;
    --green-glow: rgba(16, 185, 129, 0.25);
    --amber: #f59e0b;
    --danger: #ef4444;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0d11;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #map {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #0b0d11;
  }

  .maplibregl-ctrl-bottom-left,
  .maplibregl-ctrl-bottom-right,
  .maplibregl-ctrl-top-left,
  .maplibregl-ctrl-top-right {
    display: none !important;
  }

  /* TOP NAVIGATION STACK */
  .top-stack {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .top-stack > * {
    pointer-events: auto;
  }

  /* Route & Direction Selector Bar */
  .selector-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 5px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }

  .dir-group {
    display: flex;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 10px;
    padding: 2px;
    gap: 2px;
  }
  .dir-btn {
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.16s ease;
    white-space: nowrap;
  }
  .dir-btn.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 2px 10px var(--accent-glow);
  }

  .bar-divider {
    width: 1px;
    height: 18px;
    background: var(--border-subtle);
    flex-shrink: 0;
  }

  .route-group {
    display: flex;
    flex: 1;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .route-group::-webkit-scrollbar { display: none; }

  .route-pill {
    flex: 1;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 9px;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    transition: all 0.16s ease;
  }
  .route-pill.active {
    background: rgba(59, 130, 246, 0.16);
    border-color: rgba(96, 165, 250, 0.45);
    color: #ffffff;
  }

  /* Primary Turn-by-Turn Maneuver Card */
  .maneuver-card {
    background: var(--bg-glass-heavy);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border-subtle);
    border-radius: 18px;
    padding: 13px 15px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .maneuver-card.imminent {
    border-color: rgba(16, 185, 129, 0.65);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65), 0 0 24px rgba(16, 185, 129, 0.22);
  }

  .turn-icon-box {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    background: rgba(59, 130, 246, 0.14);
    border: 1px solid rgba(59, 130, 246, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--accent-bright);
    transition: all 0.2s ease;
  }
  .maneuver-card.imminent .turn-icon-box {
    background: rgba(16, 185, 129, 0.18);
    border-color: rgba(16, 185, 129, 0.55);
    color: var(--green);
  }
  .turn-icon-box svg {
    width: 32px;
    height: 32px;
  }

  .turn-body {
    flex: 1;
    min-width: 0;
  }
  .turn-top-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .turn-dist {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .turn-ActionTag {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent-bright);
    background: rgba(59, 130, 246, 0.14);
    padding: 3px 8px;
    border-radius: 6px;
  }
  .maneuver-card.imminent .turn-ActionTag {
    color: var(--green);
    background: rgba(16, 185, 129, 0.16);
  }
  .turn-street {
    font-size: 15px;
    font-weight: 600;
    color: #cbd5e1;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Secondary "Daarna" Preview Pill */
  .then-banner {
    align-self: flex-start;
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(13, 16, 23, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle);
    border-radius: 11px;
    padding: 6px 12px;
    margin-top: -3px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  }
  .then-banner.visible {
    display: inline-flex;
  }
  .then-banner svg {
    width: 15px;
    height: 15px;
    color: var(--text-primary);
    flex-shrink: 0;
  }
  .then-label {
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.05em;
  }

  /* Off-route alert banner */
  .offroute-banner {
    background: rgba(239, 68, 68, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 12px;
    text-align: center;
    letter-spacing: 0.02em;
    display: none;
    box-shadow: 0 8px 24px rgba(239, 68, 68, 0.35);
  }

  /* FLOATING MAP ACTION CONTROLS (Right Side) */
  .map-tools {
    position: absolute;
    right: 12px;
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + 110px);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .tool-btn {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--bg-glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
    transition: all 0.16s ease;
  }
  .tool-btn svg {
    width: 20px;
    height: 20px;
  }
  .tool-sub {
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-secondary);
    line-height: 1;
  }
  .tool-btn:active {
    transform: scale(0.94);
  }
  .tool-btn.active {
    background: rgba(59, 130, 246, 0.22);
    border-color: rgba(96, 165, 250, 0.65);
    color: var(--accent-bright);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45), 0 0 14px rgba(59, 130, 246, 0.28);
  }
  .tool-btn.active .tool-sub {
    color: #ffffff;
  }

  /* Google Maps-style Floating "Centreren" Pill (Bottom Left above HUD) */
  .recenter-pill {
    position: absolute;
    left: 12px;
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + 110px);
    z-index: 1000;
    display: none;
    align-items: center;
    gap: 8px;
    background: #2563eb;
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(37, 99, 235, 0.55);
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .recenter-pill.visible {
    display: inline-flex;
  }
  .recenter-pill:active {
    transform: scale(0.95);
  }
  .recenter-pill svg {
    width: 18px;
    height: 18px;
  }

  /* BOTTOM TELEMETRY HUD */
  .bottom-hud {
    position: absolute;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: 12px;
    right: 12px;
    z-index: 1000;
    background: var(--bg-glass-heavy);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border-subtle);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65);
  }

  .progress-track {
    width: 100%;
    height: 3px;
    background: rgba(255, 255, 255, 0.07);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3b82f6, #10b981);
    transition: width 0.4s ease;
  }

  .hud-main {
    padding: 11px 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .speed-cluster {
    display: flex;
    align-items: baseline;
    gap: 4px;
    min-width: 76px;
  }
  .speed-val {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .speed-unit {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .metrics-grid {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    justify-content: center;
  }
  .metric-cell {
    text-align: center;
  }
  .metric-val {
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .metric-lbl {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .metric-sep {
    width: 1px;
    height: 24px;
    background: var(--border-subtle);
  }

  .status-cluster {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .gps-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 4px 8px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-secondary);
  }
  .gps-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--amber);
  }
  .gps-badge.locked {
    background: rgba(16, 185, 129, 0.14);
    color: #34d399;
  }
  .gps-badge.locked .gps-dot {
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
  }
  .wake-lbl {
    font-size: 9px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  /* 3D Navigation Puck on Road Surface */
  .nav-puck-wrap {
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .nav-puck-svg {
    width: 84px;
    height: 84px;
    overflow: visible;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.55));
  }

  /* Next Turn Intersection Pulse Dot */
  .turn-target-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    border: 4px solid #3b82f6;
    box-shadow: 0 0 14px rgba(59, 130, 246, 0.9);
    pointer-events: none;
  }

  .endpoint-pin {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2.5px solid #ffffff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="top-stack">
  <div class="selector-bar">
    <div class="dir-group">
      <button class="dir-btn active" id="dir-heen" onclick="setDirection('heen')">HEEN</button>
      <button class="dir-btn" id="dir-terug" onclick="setDirection('terug')">TERUG</button>
    </div>
    <div class="bar-divider"></div>
    <div class="route-group">
      <button class="route-pill active" id="rt-r1" onclick="setRoute('r1')">1. Het Lint (39,2)</button>
      <button class="route-pill" id="rt-r2" onclick="setRoute('r2')">2. Kortst (38,2)</button>
      <button class="route-pill" id="rt-r3" onclick="setRoute('r3')">3. Polder (40,3)</button>
    </div>
  </div>

  <div class="maneuver-card" id="maneuver-card">
    <div class="turn-icon-box" id="turn-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </div>
    <div class="turn-body">
      <div class="turn-top-row">
        <div class="turn-dist" id="turn-dist">-- m</div>
        <div class="turn-ActionTag" id="turn-tag">VOLG ROUTE</div>
      </div>
      <div class="turn-street" id="turn-street">Wachten op gps-signaal...</div>
    </div>
  </div>

  <div class="then-banner" id="then-banner">
    <span class="then-label">Daarna</span>
    <span id="then-icon"></span>
    <span id="then-text">rechtdoor</span>
  </div>

  <div class="offroute-banner" id="offroute-banner">
    Van route afgeweken — blauwe lijn op kaart toont het vaste pad
  </div>
</div>

<!-- Google Maps-style Recenter / Activate 3D Navigation Pill -->
<button class="recenter-pill visible" id="recenter-pill" onclick="engageNavigation()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 19 21 12 17 5 21 12 2"/>
  </svg>
  <span id="recenter-label">Centreren &amp; Kompas</span>
</button>

<div class="map-tools">
  <!-- Compass / Course-Up vs North-Up Toggle -->
  <button class="tool-btn active" id="btn-compass" onclick="toggleCourseUp()" title="Koers boven / Noord boven">
    <svg id="compass-needle" viewBox="0 0 24 24" fill="none" style="transition: transform 0.08s linear;">
      <polygon points="12,3 15.5,12 12,10.5 8.5,12" fill="#ef4444"/>
      <polygon points="12,21 15.5,12 12,13.5 8.5,12" fill="#cbd5e1"/>
    </svg>
    <span class="tool-sub" id="lbl-compass">3D KOERS</span>
  </button>

  <!-- Recenter on User GPS -->
  <button class="tool-btn active" id="btn-follow" onclick="engageNavigation()" title="Centreer op gps">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="7"/>
      <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
      <line x1="12" y1="2" x2="12" y2="5"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="5" y2="12"/>
      <line x1="19" y1="12" x2="22" y2="12"/>
    </svg>
    <span class="tool-sub">GPS</span>
  </button>

  <!-- Full Route Overview -->
  <button class="tool-btn" id="btn-overview" onclick="fitFullRoute()" title="Hele route tonen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 3 21 3 21 9"/>
      <polyline points="9 21 3 21 3 15"/>
      <line x1="21" y1="3" x2="14" y2="10"/>
      <line x1="3" y1="21" x2="10" y2="14"/>
    </svg>
    <span class="tool-sub">OVERZICHT</span>
  </button>

  <!-- Day / Night Vector Style Toggle (Zero API key required) -->
  <button class="tool-btn" id="btn-theme" onclick="toggleMapTheme()" title="Wissel Dag / Nacht kaart">
    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
    <span class="tool-sub" id="lbl-theme">NACHT</span>
  </button>
</div>

<div class="bottom-hud">
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <div class="hud-main">
    <div class="speed-cluster">
      <span class="speed-val" id="speed-val">0</span>
      <span class="speed-unit">km/h</span>
    </div>
    <div class="metrics-grid">
      <div class="metric-cell">
        <div class="metric-val" id="rem-dist">-- km</div>
        <div class="metric-lbl">Resterend</div>
      </div>
      <div class="metric-sep"></div>
      <div class="metric-cell">
        <div class="metric-val" id="rem-time">-- min</div>
        <div class="metric-lbl">Rijtijd</div>
      </div>
      <div class="metric-sep"></div>
      <div class="metric-cell">
        <div class="metric-val" id="eta-time">--:--</div>
        <div class="metric-lbl">Aankomst</div>
      </div>
    </div>
    <div class="status-cluster">
      <div class="gps-badge" id="gps-badge">
        <span class="gps-dot"></span>
        <span id="gps-text">ZOEK GPS</span>
      </div>
      <div class="wake-lbl" id="wake-lbl">KOMPAS + GPS</div>
    </div>
  </div>
</div>

<script>
// 100% Free Vector GL Styles (CARTO Protomaps Vector Tiles — No API Key Required)
const STYLE_DARK  = "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json";
const STYLE_LIGHT = "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json";

let NAV_DATA = null;
let curRoute = "r1";
let curDir = "heen";
let lightTheme = false;

let map = null;
let styleReady = false;
let userMarker = null;
let turnMarker = null;
let startMarker = null;
let endMarker = null;

// Navigation & Camera State
let followUser = true;
let courseUp = true; // true = 3D rotating course-up like Google Maps; false = 2D north-up
let isDragging = false;
let isEasing = false;
let firstFixReceived = false;

// Live Sensor State ([lon, lat] for MapLibre)
let targetLngLat = null;
let displayLngLat = null;
let targetHeading = 0;
let displayHeading = 0;
let compassHeading = null;
let gpsHeading = null;
let lastSpeedMps = 0;
let compassGranted = false;

// Active Route Geometry Cache
let routeCoordsLatLon = []; // [[lat, lon], ...]
let routeCoordsLngLat = []; // [[lon, lat], ...]
let cumDist = [];
let totalRouteMeters = 0;
let currentSplitIdx = 0;

const params = new URLSearchParams(window.location.search);
if (params.get("route") && ["r1", "r2", "r3"].includes(params.get("route"))) {
  curRoute = params.get("route");
}
if (params.get("dir") && ["heen", "terug"].includes(params.get("dir"))) {
  curDir = params.get("dir");
}

function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function calcBearing(lat1, lon1, lat2, lon2) {
  const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

// Shortest-arc angular interpolation (handles 359° -> 1° wraparound smoothly)
function angleDiff(from, to) {
  return ((to - from + 540) % 360) - 180;
}
function lerpAngle(from, to, t) {
  return (from + angleDiff(from, to) * t + 360) % 360;
}

function createPuckElement() {
  const wrap = document.createElement("div");
  wrap.className = "nav-puck-wrap";
  wrap.innerHTML = `
    <svg class="nav-puck-svg" viewBox="0 0 84 84">
      <defs>
        <radialGradient id="beamGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.50"/>
          <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- Forward radar cone pointing UP (0 deg) -->
      <path d="M42 42 L16 6 A40 40 0 0 1 68 6 Z" fill="url(#beamGrad)"/>
      <!-- Outer halo -->
      <circle cx="42" cy="42" r="18" fill="rgba(59, 130, 246, 0.25)"/>
      <!-- White shield + Blue directional navigation chevron -->
      <circle cx="42" cy="42" r="14" fill="#ffffff"/>
      <path d="M42 31 L50 49 L42 44.5 L34 49 Z" fill="#2563eb"/>
    </svg>`;
  return wrap;
}

function initMap() {
  map = new maplibregl.Map({
    container: "map",
    style: STYLE_DARK,
    center: [4.96, 52.175],
    zoom: 10.8,
    pitch: 0,
    bearing: 0,
    attributionControl: false,
    dragRotate: true,
    touchPitch: true,
    maxPitch: 65
  });

  map.on("style.load", () => {
    styleReady = true;
    ensureRouteLayers();
    updateRouteGeoJSON();
  });

  // Detect manual user pan/pinch to pause auto-follow and show "Centreren" pill
  const onUserGestureStart = (e) => {
    if (e && e.originalEvent) {
      isDragging = true;
      followUser = false;
      updateControlStates();
    }
  };
  const onUserGestureEnd = () => {
    isDragging = false;
  };

  map.on("dragstart", onUserGestureStart);
  map.on("rotatestart", onUserGestureStart);
  map.on("pitchstart", onUserGestureStart);
  map.on("dragend", onUserGestureEnd);
  map.on("rotateend", onUserGestureEnd);
  map.on("pitchend", onUserGestureEnd);

  map.on("rotate", () => {
    const needle = document.getElementById("compass-needle");
    if (needle) {
      needle.style.transform = `rotate(${-map.getBearing()}deg)`;
    }
  });

  // Unlock iOS Compass + Screen Wake Lock on the very first touch anywhere
  document.addEventListener("click", () => {
    requestCompassPermission();
    requestWakeLock();
  }, { once: true });

  fetch("nav_routes.json?v=3")
    .then(r => r.json())
    .then(data => {
      NAV_DATA = data;
      renderSelectedRoute(true);
      startGpsTracking();
      initCompassListener();
      requestAnimationFrame(cameraLoop);
    });
}

function ensureRouteLayers() {
  if (!map || !styleReady) return;

  if (!map.getSource("route-traveled")) {
    map.addSource("route-traveled", {
      type: "geojson",
      data: { type: "Feature", geometry: { type: "LineString", coordinates: [] } }
    });
  }
  if (!map.getSource("route-ahead")) {
    map.addSource("route-ahead", {
      type: "geojson",
      data: { type: "Feature", geometry: { type: "LineString", coordinates: [] } }
    });
  }

  if (!map.getLayer("route-traveled-line")) {
    map.addLayer({
      id: "route-traveled-line",
      type: "line",
      source: "route-traveled",
      layout: { "line-join": "round", "line-cap": "round" },
      paint: {
        "line-color": "#64748b",
        "line-width": 6,
        "line-opacity": 0.55
      }
    });
  }

  if (!map.getLayer("route-ahead-glow")) {
    map.addLayer({
      id: "route-ahead-glow",
      type: "line",
      source: "route-ahead",
      layout: { "line-join": "round", "line-cap": "round" },
      paint: {
        "line-color": "#3b82f6",
        "line-width": 16,
        "line-opacity": 0.26,
        "line-blur": 4
      }
    });
  }

  if (!map.getLayer("route-ahead-casing")) {
    map.addLayer({
      id: "route-ahead-casing",
      type: "line",
      source: "route-ahead",
      layout: { "line-join": "round", "line-cap": "round" },
      paint: {
        "line-color": "#1d4ed8",
        "line-width": 9,
        "line-opacity": 0.95
      }
    });
  }

  if (!map.getLayer("route-ahead-core")) {
    map.addLayer({
      id: "route-ahead-core",
      type: "line",
      source: "route-ahead",
      layout: { "line-join": "round", "line-cap": "round" },
      paint: {
        "line-color": "#60a5fa",
        "line-width": 5.5,
        "line-opacity": 1.0
      }
    });
  }
}

function updateRouteGeoJSON() {
  if (!map || !styleReady || !routeCoordsLngLat.length) return;
  ensureRouteLayers();

  const split = Math.max(0, Math.min(currentSplitIdx, routeCoordsLngLat.length - 1));
  const traveledCoords = routeCoordsLngLat.slice(0, split + 1);
  const aheadCoords = routeCoordsLngLat.slice(split);

  const srcTraveled = map.getSource("route-traveled");
  if (srcTraveled) {
    srcTraveled.setData({
      type: "Feature",
      geometry: {
        type: "LineString",
        coordinates: traveledCoords.length >= 2 ? traveledCoords : [routeCoordsLngLat[0], routeCoordsLngLat[0]]
      }
    });
  }

  const srcAhead = map.getSource("route-ahead");
  if (srcAhead) {
    srcAhead.setData({
      type: "Feature",
      geometry: {
        type: "LineString",
        coordinates: aheadCoords.length >= 2 ? aheadCoords : routeCoordsLngLat
      }
    });
  }
}

function setDirection(dir) {
  curDir = dir;
  document.getElementById("dir-heen").classList.toggle("active", dir === "heen");
  document.getElementById("dir-terug").classList.toggle("active", dir === "terug");
  renderSelectedRoute(!targetLngLat);
}

function setRoute(rKey) {
  curRoute = rKey;
  ["r1", "r2", "r3"].forEach(k => {
    document.getElementById("rt-" + k).classList.toggle("active", k === rKey);
  });
  renderSelectedRoute(!targetLngLat);
}

function renderSelectedRoute(fitBoundsIfNoGps) {
  if (!NAV_DATA) return;
  const rData = NAV_DATA[curRoute][curDir];
  routeCoordsLatLon = rData.coords;
  routeCoordsLngLat = routeCoordsLatLon.map(c => [c[1], c[0]]);
  currentSplitIdx = 0;

  cumDist = new Array(routeCoordsLatLon.length).fill(0);
  for (let i = 1; i < routeCoordsLatLon.length; i++) {
    cumDist[i] = cumDist[i - 1] + haversine(
      routeCoordsLatLon[i - 1][0], routeCoordsLatLon[i - 1][1],
      routeCoordsLatLon[i][0], routeCoordsLatLon[i][1]
    );
  }
  totalRouteMeters = cumDist[cumDist.length - 1] || rData.distance_m;

  // Set default initial heading along start of route
  if (routeCoordsLatLon.length > 5 && compassHeading === null && gpsHeading === null) {
    targetHeading = calcBearing(
      routeCoordsLatLon[0][0], routeCoordsLatLon[0][1],
      routeCoordsLatLon[5][0], routeCoordsLatLon[5][1]
    );
    displayHeading = targetHeading;
  }

  updateRouteGeoJSON();

  // Start & End Endpoint Pins
  if (startMarker) startMarker.remove();
  if (endMarker) endMarker.remove();

  const startEl = document.createElement("div");
  startEl.className = "endpoint-pin";
  startEl.style.background = "#10b981";
  startMarker = new maplibregl.Marker({ element: startEl })
    .setLngLat(routeCoordsLngLat[0])
    .addTo(map);

  const endEl = document.createElement("div");
  endEl.className = "endpoint-pin";
  endEl.style.background = "#ef4444";
  endMarker = new maplibregl.Marker({ element: endEl })
    .setLngLat(routeCoordsLngLat[routeCoordsLngLat.length - 1])
    .addTo(map);

  if (fitBoundsIfNoGps && !targetLngLat) {
    fitFullRoute(false);
  }

  updateHudStatic(rData);
  if (targetLngLat) {
    processLocationUpdate(targetLngLat[1], targetLngLat[0], lastSpeedMps, gpsHeading);
  }
}

function fitFullRoute(disableFollow = true) {
  if (!routeCoordsLngLat.length) return;
  if (disableFollow) {
    followUser = false;
    updateControlStates();
  }
  const bounds = new maplibregl.LngLatBounds(routeCoordsLngLat[0], routeCoordsLngLat[0]);
  for (const pt of routeCoordsLngLat) bounds.extend(pt);
  isEasing = true;
  map.fitBounds(bounds, {
    padding: { top: 195, bottom: 120, left: 36, right: 72 },
    pitch: 0,
    bearing: 0,
    duration: 700
  });
  setTimeout(() => { isEasing = false; }, 720);
}

// Engage Google Maps-style 3D Follow + Hardware Compass
function engageNavigation() {
  requestCompassPermission();
  requestWakeLock();
  followUser = true;
  updateControlStates();

  if (targetLngLat) {
    isEasing = true;
    map.easeTo({
      center: targetLngLat,
      zoom: 16.8,
      pitch: courseUp ? 55 : 0,
      bearing: courseUp ? displayHeading : 0,
      padding: { top: 210, bottom: 140, left: 0, right: 0 },
      duration: 650
    });
    setTimeout(() => { isEasing = false; }, 680);
  } else if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(onGpsPos, onGpsErr, {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 8000
    });
  }
}

function toggleCourseUp() {
  requestCompassPermission();
  courseUp = !courseUp;
  followUser = true;
  updateControlStates();

  if (targetLngLat) {
    isEasing = true;
    map.easeTo({
      center: targetLngLat,
      zoom: courseUp ? 16.8 : 15.5,
      pitch: courseUp ? 55 : 0,
      bearing: courseUp ? displayHeading : 0,
      padding: courseUp ? { top: 210, bottom: 140, left: 0, right: 0 } : { top: 140, bottom: 110, left: 0, right: 0 },
      duration: 550
    });
    setTimeout(() => { isEasing = false; }, 580);
  }
}

function toggleMapTheme() {
  lightTheme = !lightTheme;
  styleReady = false;
  map.setStyle(lightTheme ? STYLE_LIGHT : STYLE_DARK);
  document.getElementById("btn-theme").classList.toggle("active", lightTheme);
  document.getElementById("lbl-theme").textContent = lightTheme ? "DAG" : "NACHT";
}

function updateControlStates() {
  document.getElementById("btn-follow").classList.toggle("active", followUser);
  document.getElementById("btn-compass").classList.toggle("active", courseUp);
  document.getElementById("lbl-compass").textContent = courseUp ? "3D KOERS" : "2D NOORD";

  const pill = document.getElementById("recenter-pill");
  const label = document.getElementById("recenter-label");
  if (!followUser) {
    pill.classList.add("visible");
    label.textContent = "Centreren";
  } else if (!compassGranted && typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    pill.classList.add("visible");
    label.textContent = "Activeer Kompas (3D)";
  } else {
    pill.classList.remove("visible");
  }
}

// iOS Hardware Magnetometer Compass Integration
function requestCompassPermission() {
  if (compassGranted) return;
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission()
      .then(state => {
        if (state === "granted") {
          compassGranted = true;
          window.addEventListener("deviceorientation", onDeviceOrientation, true);
          updateControlStates();
        }
      })
      .catch(() => {});
  } else {
    compassGranted = true;
    updateControlStates();
  }
}

function initCompassListener() {
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission !== "function") {
    compassGranted = true;
    window.addEventListener("deviceorientationabsolute", onDeviceOrientation, true);
    window.addEventListener("deviceorientation", onDeviceOrientation, true);
  }
  updateControlStates();
}

function onDeviceOrientation(e) {
  let hdg = null;
  if (typeof e.webkitCompassHeading === "number" && !isNaN(e.webkitCompassHeading)) {
    // iOS true/magnetic north heading in degrees (0 = North, 90 = East)
    hdg = e.webkitCompassHeading;
  } else if (e.absolute === true && typeof e.alpha === "number") {
    hdg = (360 - e.alpha) % 360;
  }
  if (hdg === null) return;

  compassHeading = (hdg + 360) % 360;
  compassGranted = true;

  // Sensor Fusion:
  // - Below 8 km/h (2.2 m/s) or when GPS course is unavailable, follow the phone's compass directly
  // - Above 8 km/h, blend 75% GPS movement course + 25% compass for rock-steady road tracking
  if (lastSpeedMps < 2.2 || gpsHeading === null) {
    targetHeading = compassHeading;
  } else {
    targetHeading = lerpAngle(compassHeading, gpsHeading, 0.75);
  }
}

// 60 FPS Smooth Camera & Navigation Puck Loop
function cameraLoop() {
  if (targetLngLat) {
    if (!displayLngLat) {
      displayLngLat = [targetLngLat[0], targetLngLat[1]];
    } else {
      displayLngLat[0] += (targetLngLat[0] - displayLngLat[0]) * 0.16;
      displayLngLat[1] += (targetLngLat[1] - displayLngLat[1]) * 0.16;
    }

    displayHeading = lerpAngle(displayHeading, targetHeading, 0.18);

    if (userMarker) {
      userMarker.setLngLat(displayLngLat);
      userMarker.setRotation(displayHeading);
    }

    if (followUser && !isDragging && !isEasing && firstFixReceived) {
      map.jumpTo({
        center: displayLngLat,
        bearing: courseUp ? displayHeading : 0,
        pitch: courseUp ? 55 : 0
      });
    }
  }
  requestAnimationFrame(cameraLoop);
}

function updateHudStatic(rData) {
  const remKm = (rData.distance_m / 1000).toFixed(1).replace(".", ",");
  const mins = Math.round((rData.distance_m / 1000) / 51.5 * 60);
  document.getElementById("rem-dist").textContent = remKm + " km";
  document.getElementById("rem-time").textContent = mins + " min";
  const eta = new Date(Date.now() + mins * 60000);
  document.getElementById("eta-time").textContent =
    String(eta.getHours()).padStart(2, "0") + ":" + String(eta.getMinutes()).padStart(2, "0");

  if (rData.steps.length > 0) {
    setManeuverUI(rData.steps[0], rData.steps[1] || null, 0, 0);
  }
}

function getTurnSvg(mod, type, size = 32) {
  let path = `<path d="M12 19V5M5 12l7-7 7 7"/>`;
  if (type === "arrive") {
    path = `<circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 6.9 8 11.7z"/>`;
  } else if (type === "roundabout" || type === "rotary") {
    path = `<circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 16v6M16 12h6"/>`;
  } else if (mod.includes("left")) {
    path = mod.includes("slight")
      ? `<path d="M17 19V9l-7-5"/><path d="M10 9V4h5"/>`
      : `<path d="M18 19v-7a3 3 0 0 0-3-3H5"/><path d="M9 5 5 9l4 4"/>`;
  } else if (mod.includes("right")) {
    path = mod.includes("slight")
      ? `<path d="M7 19V9l7-5"/><path d="M14 9V4H9"/>`
      : `<path d="M6 19v-7a3 3 0 0 1 3-3h10"/><path d="m15 5 4 4-4 4"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}

function getActionTag(step) {
  const mod = step.mod || "";
  const type = step.type || "";
  if (type === "arrive") return "BESTEMMING";
  if (type === "roundabout" || type === "rotary") return "ROTONDE";
  if (mod === "sharp left") return "SCHERP LINKS";
  if (mod === "left") return "LINKSAAF";
  if (mod === "slight left") return "LINKS AANHOUDEN";
  if (mod === "sharp right") return "SCHERP RECHTS";
  if (mod === "right") return "RECHTSAF";
  if (mod === "slight right") return "RECHTS AANHOUDEN";
  return "RECHTDOOR";
}

function formatDist(m) {
  if (m >= 1000) return (m / 1000).toFixed(1).replace(".", ",") + " km";
  if (m >= 100) return Math.round(m / 10) * 10 + " m";
  return Math.max(5, Math.round(m / 5) * 5) + " m";
}

function setManeuverUI(step, nextStep, distToStep, gapToNext) {
  document.getElementById("turn-dist").textContent = formatDist(distToStep);
  document.getElementById("turn-tag").textContent = getActionTag(step);
  document.getElementById("turn-street").textContent = step.text + (step.name ? " — " + step.name : "");
  document.getElementById("turn-icon").innerHTML = getTurnSvg(step.mod || "", step.type || "", 32);

  const card = document.getElementById("maneuver-card");
  card.classList.toggle("imminent", distToStep <= 140);

  const thenBanner = document.getElementById("then-banner");
  if (nextStep && distToStep <= 500 && gapToNext <= 450) {
    thenBanner.classList.add("visible");
    document.getElementById("then-icon").innerHTML = getTurnSvg(nextStep.mod || "", nextStep.type || "", 15);
    document.getElementById("then-text").textContent =
      nextStep.text.toLowerCase() + (nextStep.name ? " (" + nextStep.name + ")" : "");
  } else {
    thenBanner.classList.remove("visible");
  }
}

function startGpsTracking() {
  if (!navigator.geolocation) {
    document.getElementById("gps-text").textContent = "GEEN GPS";
    return;
  }
  navigator.geolocation.watchPosition(onGpsPos, onGpsErr, {
    enableHighAccuracy: true,
    maximumAge: 1000,
    timeout: 10000
  });
}

function onGpsPos(pos) {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const spdMps = pos.coords.speed || 0;
  const hdg = pos.coords.heading;

  lastSpeedMps = spdMps;
  if (hdg !== null && !isNaN(hdg) && spdMps >= 1.8) {
    gpsHeading = hdg;
  }

  processLocationUpdate(lat, lon, spdMps, gpsHeading);
}

function processLocationUpdate(lat, lon, spdMps, hdg) {
  const badge = document.getElementById("gps-badge");
  badge.classList.add("locked");
  document.getElementById("gps-text").textContent = "GPS ACTIEF";

  const kmh = Math.max(0, Math.round(spdMps * 3.6));
  document.getElementById("speed-val").textContent = kmh;

  targetLngLat = [lon, lat];

  if (!userMarker && map) {
    const el = createPuckElement();
    userMarker = new maplibregl.Marker({
      element: el,
      rotationAlignment: "map",
      pitchAlignment: "map"
    })
      .setLngLat([lon, lat])
      .setRotation(displayHeading)
      .addTo(map);
  }

  // Auto-select Heen or Terug on first GPS fix if within 2 km of start
  if (!firstFixReceived && NAV_DATA && !params.get("dir")) {
    const dHome = haversine(lat, lon, 52.28640, 4.82693);
    const dWork = haversine(lat, lon, 52.06365, 5.10798);
    if (dWork < 2000 && curDir !== "terug") {
      setDirection("terug");
    } else if (dHome < 2000 && curDir !== "heen") {
      setDirection("heen");
    }
  }

  if (!NAV_DATA || !routeCoordsLatLon.length) return;
  const rData = NAV_DATA[curRoute][curDir];

  // Snap to closest vertex on route
  let bestIdx = 0;
  let bestDist = Infinity;
  for (let i = 0; i < routeCoordsLatLon.length; i++) {
    const d = haversine(lat, lon, routeCoordsLatLon[i][0], routeCoordsLatLon[i][1]);
    if (d < bestDist) {
      bestDist = d;
      bestIdx = i;
    }
  }

  currentSplitIdx = bestIdx;
  updateRouteGeoJSON();

  // Heading fusion fallback if neither compass nor GPS course is active yet
  if (hdg !== null && !isNaN(hdg) && spdMps >= 2.2) {
    targetHeading = compassHeading !== null ? lerpAngle(compassHeading, hdg, 0.75) : hdg;
  } else if (compassHeading !== null) {
    targetHeading = compassHeading;
  } else if (bestIdx < routeCoordsLatLon.length - 2) {
    const nextIdx = Math.min(routeCoordsLatLon.length - 1, bestIdx + 3);
    targetHeading = calcBearing(
      routeCoordsLatLon[bestIdx][0], routeCoordsLatLon[bestIdx][1],
      routeCoordsLatLon[nextIdx][0], routeCoordsLatLon[nextIdx][1]
    );
  }

  // On very first GPS fix, smoothly fly into 3D Course-Up view centered on the user
  if (!firstFixReceived && map) {
    firstFixReceived = true;
    displayLngLat = [lon, lat];
    displayHeading = targetHeading;
    if (followUser) {
      isEasing = true;
      map.easeTo({
        center: [lon, lat],
        zoom: 16.8,
        pitch: courseUp ? 55 : 0,
        bearing: courseUp ? displayHeading : 0,
        padding: { top: 210, bottom: 140, left: 0, right: 0 },
        duration: 850
      });
      setTimeout(() => { isEasing = false; }, 880);
    }
    updateControlStates();
  }

  // Off-route warning if > 95m from locked path
  document.getElementById("offroute-banner").style.display = bestDist > 95 ? "block" : "none";

  // Remaining distance, ETA & progress bar
  const traveledM = cumDist[bestIdx] || 0;
  const remMeters = Math.max(0, totalRouteMeters - traveledM);
  const pct = Math.min(100, Math.max(0, (traveledM / Math.max(1, totalRouteMeters)) * 100));
  document.getElementById("progress-fill").style.width = pct.toFixed(1) + "%";

  const remKm = (remMeters / 1000).toFixed(1).replace(".", ",");
  const effSpeedKmh = kmh > 18 ? Math.min(56, Math.max(25, kmh * 0.92)) : 51.5;
  const remMins = Math.max(1, Math.round((remMeters / 1000) / effSpeedKmh * 60));

  document.getElementById("rem-dist").textContent = remKm + " km";
  document.getElementById("rem-time").textContent = remMins + " min";
  const eta = new Date(Date.now() + remMins * 60000);
  document.getElementById("eta-time").textContent =
    String(eta.getHours()).padStart(2, "0") + ":" + String(eta.getMinutes()).padStart(2, "0");

  // Find next upcoming turn maneuver
  let nextStep = rData.steps[rData.steps.length - 1];
  let secondStep = null;
  let distToNext = remMeters;
  let gapToSecond = 9999;

  for (let s = 0; s < rData.steps.length; s++) {
    const st = rData.steps[s];
    if (st.type === "depart") continue;
    let stIdx = 0;
    let stBest = Infinity;
    for (let i = bestIdx; i < routeCoordsLatLon.length; i++) {
      const d = haversine(st.lat, st.lon, routeCoordsLatLon[i][0], routeCoordsLatLon[i][1]);
      if (d < stBest) {
        stBest = d;
        stIdx = i;
      }
    }
    const dAlong = (cumDist[stIdx] || 0) - traveledM;
    if (dAlong > 12) {
      nextStep = st;
      distToNext = dAlong;
      if (s + 1 < rData.steps.length) {
        secondStep = rData.steps[s + 1];
        gapToSecond = st.dist || 9999;
      }
      break;
    }
  }

  setManeuverUI(nextStep, secondStep, distToNext, gapToSecond);

  if (map) {
    if (!turnMarker) {
      const dotEl = document.createElement("div");
      dotEl.className = "turn-target-dot";
      turnMarker = new maplibregl.Marker({ element: dotEl })
        .setLngLat([nextStep.lon, nextStep.lat])
        .addTo(map);
    } else {
      turnMarker.setLngLat([nextStep.lon, nextStep.lat]);
    }
  }
}

function onGpsErr() {
  const badge = document.getElementById("gps-badge");
  badge.classList.remove("locked");
  document.getElementById("gps-text").textContent = "GPS WACHT";
}

async function requestWakeLock() {
  if ("wakeLock" in navigator) {
    try {
      await navigator.wakeLock.request("screen");
      document.getElementById("wake-lbl").textContent = "SCHERM BLIJFT AAN";
    } catch (e) {}
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});

window.addEventListener("DOMContentLoaded", () => {
  initMap();
  requestWakeLock();
});
</script>
