<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antigravity">
<meta name="theme-color" content="#0e0f12">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<title>Antigravity</title>
<style>
:root {
  --bg: #0e0f12;
  --sidebar: #121317;
  --surface: #17191f;
  --surface-elevated: #1c1f26;
  --code-bg: #111318;
  --user-bubble: #1e2028;
  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.11);
  --text: #e6e8ee;
  --text-secondary: #9ba1b0;
  --text-muted: #646a78;
  --link: #6cb6ff;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.58;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
header {
  padding-top: max(env(safe-area-inset-top), 12px);
  padding-bottom: 10px;
  padding-left: 12px;
  padding-right: 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 20;
}
.hdr-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.icon-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  width: 30px;
  height: 30px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
}
.icon-btn:active {
  background: var(--surface);
  color: var(--text);
}
.session-title {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#drawer {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 50;
  display: none;
}
#drawer.open { display: block; }
.drawer-panel {
  width: 80%;
  max-width: 290px;
  height: 100%;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  padding: max(env(safe-area-inset-top), 14px) 10px max(env(safe-area-inset-bottom), 14px) 10px;
  display: flex;
  flex-direction: column;
}
.new-conv-btn {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  margin-bottom: 12px;
}
.section-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  padding: 4px 8px 6px 8px;
}
.conv-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.conv-item {
  padding: 8px 10px;
  border-radius: 7px;
  cursor: pointer;
}
.conv-item.active {
  background: var(--surface-elevated);
}
.conv-title {
  font-size: 13px;
  font-weight: 400;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.conv-item.active .conv-title {
  font-weight: 500;
}
.conv-meta {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  margin-top: 2px;
}
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px 16px 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  -webkit-overflow-scrolling: touch;
}
.turn-user {
  align-self: flex-end;
  max-width: 85%;
  background: var(--user-bubble);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.5;
  word-wrap: break-word;
  white-space: pre-wrap;
}
.turn-agent {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.thought-block {
  margin-bottom: 2px;
}
.thought-summary {
  font-size: 12.5px;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.thought-chev {
  transition: transform 0.15s ease;
  display: inline-block;
}
.thought-block.open .thought-chev {
  transform: rotate(90deg);
}
.thought-body {
  font-size: 12.5px;
  color: var(--text-secondary);
  border-left: 2px solid var(--border-strong);
  padding-left: 10px;
  margin-top: 6px;
  display: none;
  white-space: pre-wrap;
  line-height: 1.5;
}
.thought-block.open .thought-body {
  display: block;
}
.tools-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 2px 0;
}
.tool-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text-muted);
  font-family: "SF Mono", Menlo, Consolas, monospace;
}
.markdown-body {
  color: var(--text);
  font-size: 14px;
  line-height: 1.62;
  overflow-wrap: break-word;
}
.markdown-body > *:first-child { margin-top: 0; }
.markdown-body > *:last-child { margin-bottom: 0; }
.markdown-body p { margin: 0 0 10px 0; }
.markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
  color: #f2f4f8;
  font-weight: 600;
  line-height: 1.3;
  margin: 18px 0 8px 0;
  letter-spacing: -0.2px;
}
.markdown-body h1 { font-size: 18px; }
.markdown-body h2 { font-size: 16px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
.markdown-body h3 { font-size: 14.5px; }
.markdown-body h4 { font-size: 13.5px; }
.markdown-body ul, .markdown-body ol {
  margin: 0 0 10px 0;
  padding-left: 20px;
}
.markdown-body li { margin-bottom: 4px; }
.markdown-body li > p { margin-bottom: 4px; }
.markdown-body hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 14px 0;
}
.markdown-body blockquote {
  margin: 8px 0 10px 0;
  padding: 6px 12px;
  border-left: 3px solid var(--border-strong);
  background: rgba(255, 255, 255, 0.02);
  color: var(--text-secondary);
  border-radius: 0 6px 6px 0;
}
.markdown-body code {
  font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  font-size: 12.5px;
  background: var(--surface-elevated);
  color: #d8dee9;
  padding: 1.5px 5px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.markdown-body pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 13px;
  overflow-x: auto;
  margin: 8px 0 12px 0;
}
.markdown-body pre code {
  background: transparent;
  border: none;
  padding: 0;
  font-size: 12px;
  line-height: 1.5;
  color: #e6e8ee;
}
.table-wrap {
  width: 100%;
  overflow-x: auto;
  margin: 8px 0 12px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
}
.markdown-body table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
.markdown-body th, .markdown-body td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}
.markdown-body th {
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
}
.markdown-body tr:last-child td {
  border-bottom: none;
}
.markdown-body a {
  color: var(--link);
  text-decoration: none;
}
footer {
  padding: 6px 12px calc(max(env(safe-area-inset-bottom), 10px)) 12px;
  background: var(--bg);
}
.composer {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  padding: 10px 10px 8px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
textarea {
  width: 100%;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  line-height: 1.45;
  resize: none;
  max-height: 120px;
  outline: none;
  padding: 0;
}
textarea::placeholder {
  color: var(--text-muted);
}
.composer-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.composer-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
}
.send-btn {
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: 7px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
}
</style>
</head>
<body>
<header>
  <div class="hdr-left">
    <button class="icon-btn" onclick="toggleDrawer(true)" aria-label="Sidebar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <rect x="2" y="2.5" width="12" height="11" rx="2"/>
        <path d="M6 2.5v11"/>
      </svg>
    </button>
    <span class="session-title" id="hdr-title">iPhone 13 & PC Workspace</span>
  </div>
  <button class="icon-btn" onclick="promptNewChat()" aria-label="New conversation">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M8 3.2v9.6M3.2 8h9.6"/>
    </svg>
  </button>
</header>

<div id="drawer" onclick="if(event.target.id==='drawer')toggleDrawer(false)">
  <div class="drawer-panel">
    <button class="new-conv-btn" onclick="toggleDrawer(false);promptNewChat()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M8 3v10M3 8h10"/>
      </svg>
      <span>New conversation</span>
    </button>
    <div class="section-label">Recent</div>
    <div class="conv-list" id="conv-list"></div>
  </div>
</div>

<div id="chat"></div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask Antigravity..." oninput="this.style.height='auto';this.style.height=(this.scrollHeight)+'px'"></textarea>
    <div class="composer-bar">
      <div class="composer-meta">
        <span>Gemini 2.5 Pro</span>
      </div>
      <button class="send-btn" onclick="sendMessage()" aria-label="Send">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/>
        </svg>
      </button>
    </div>
  </div>
</footer>

<script>
let currentConv = "90a21ecb-1307-4222-821b-4e7ce0c293ba";
let lastStepCount = -1;
let API_BASE = "";

if (window.marked) {
  marked.setOptions({ gfm: true, breaks: true });
}

async function resolveApiBase() {
  try {
    const r = await fetch("/api/conversations", {signal: AbortSignal.timeout(1600)});
    if (r.ok) { API_BASE = ""; return; }
  } catch (e) {}
  try {
    const g = await fetch("https://api.github.com/gists/4277208e57b4f464f51d026fbd7a730a", {cache: "no-store"});
    const gj = await g.json();
    const info = JSON.parse(gj.files["agy_endpoint.json"].content);
    if (info.tunnel_url) {
      API_BASE = info.tunnel_url;
      return;
    }
  } catch (e) {}
}

function toggleDrawer(open) {
  const d = document.getElementById("drawer");
  if (open) { d.classList.add("open"); loadConversations(); }
  else d.classList.remove("open");
}

async function loadConversations() {
  try {
    const r = await fetch(API_BASE + "/api/conversations");
    const list = await r.json();
    const el = document.getElementById("conv-list");
    el.innerHTML = "";
    list.forEach(c => {
      const div = document.createElement("div");
      div.className = "conv-item" + (c.id === currentConv ? " active" : "");
      div.onclick = () => {
        currentConv = c.id;
        lastStepCount = -1;
        document.getElementById("hdr-title").textContent = c.title;
        toggleDrawer(false);
        loadMessages(true);
      };
      div.innerHTML = `<div class="conv-title">${escapeHtml(c.title)}</div>
        <div class="conv-meta"><span>${c.steps} steps</span><span>${c.updated_str}</span></div>`;
      el.appendChild(div);
    });
  } catch (e) {}
}

function escapeHtml(s) {
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderMarkdown(md) {
  if (!md) return "";
  if (window.marked) {
    let html = marked.parse(md);
    html = html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '</table></div>');
    return html;
  }
  let out = escapeHtml(md);
  out = out.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
  out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return out.replace(/\n/g, "<br>");
}

async function loadMessages(forceScroll) {
  try {
    const r = await fetch(API_BASE + "/api/messages?id=" + encodeURIComponent(currentConv));
    const msgs = await r.json();
    if (!forceScroll && msgs.length === lastStepCount) return;
    lastStepCount = msgs.length;
    const chat = document.getElementById("chat");
    chat.innerHTML = "";
    msgs.forEach(m => {
      const div = document.createElement("div");
      if (m.role === "user") {
        div.className = "turn-user";
        div.textContent = m.content;
      } else {
        div.className = "turn-agent";
        let inner = "";
        if (m.thinking) {
          inner += `<div class="thought-block" onclick="this.classList.toggle('open')">
            <div class="thought-summary"><span class="thought-chev">›</span><span>Thought</span></div>
            <div class="thought-body">${escapeHtml(m.thinking)}</div>
          </div>`;
        }
        if (m.tools && m.tools.length) {
          inner += `<div class="tools-list">` + m.tools.map(t => `<div class="tool-row">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-6.5"/></svg>
            <span>${escapeHtml(t)}</span>
          </div>`).join("") + `</div>`;
        }
        if (m.content) {
          inner += `<div class="markdown-body">${renderMarkdown(m.content)}</div>`;
        }
        div.innerHTML = inner;
      }
      chat.appendChild(div);
    });
    chat.scrollTop = chat.scrollHeight;
  } catch (e) {}
}

async function sendMessage() {
  const inp = document.getElementById("input");
  const text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  inp.style.height = "auto";
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "turn-user";
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  await fetch(API_BASE + "/api/send", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id: currentConv, content: text})
  });
  setTimeout(() => loadMessages(true), 800);
}

async function promptNewChat() {
  const promptText = window.prompt("New conversation prompt:");
  if (!promptText || !promptText.trim()) return;
  const r = await fetch(API_BASE + "/api/new", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({prompt: promptText.trim()})
  });
  const res = await r.json();
  if (res.conversation_id) {
    currentConv = res.conversation_id;
    lastStepCount = -1;
    loadMessages(true);
  }
}

(async () => {
  await resolveApiBase();
  loadConversations();
  loadMessages(true);
  setInterval(() => loadMessages(false), 2500);
})();
</script>
</body>
</html>
