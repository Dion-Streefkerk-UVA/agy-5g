<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antigravity">
<meta name="theme-color" content="#0e0f12">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<title>Antigravity</title>
<style>
:root {
  --bg: #0e0f12;
  --sidebar: #121317;
  --surface: #17191f;
  --surface-elevated: #1c1f26;
  --code-bg: #111318;
  --user-bubble: #1e2028;
  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.12);
  --text: #e6e8ee;
  --text-secondary: #9ba1b0;
  --text-muted: #646a78;
  --link: #6cb6ff;
  --green: #10b981;
  --amber: #f59e0b;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.58;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
header {
  padding-top: max(env(safe-area-inset-top), 12px);
  padding-bottom: 10px;
  padding-left: 12px;
  padding-right: 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  z-index: 20;
}
.hdr-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1;
}
.hdr-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.icon-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  width: 30px;
  height: 30px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn:active {
  background: var(--surface);
  color: var(--text);
}
.session-title {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  padding: 4px 9px;
  border-radius: 7px;
  text-decoration: none;
  white-space: nowrap;
}
.nav-pill:active {
  background: var(--surface-elevated);
  color: var(--text);
}
#drawer {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 100;
  display: none;
}
#drawer.open { display: block; }
.drawer-panel {
  width: 280px;
  height: 100%;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  padding-top: max(env(safe-area-inset-top), 14px);
  display: flex;
  flex-direction: column;
}
.new-conv-btn {
  margin: 0 12px 10px 12px;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.section-label {
  padding: 6px 16px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.conv-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 20px 8px;
}
.conv-item {
  padding: 8px 10px;
  border-radius: 7px;
  cursor: pointer;
  margin-bottom: 2px;
}
.conv-item.active {
  background: var(--surface-elevated);
}
.conv-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.conv-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
  display: flex;
  justify-content: space-between;
}
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  -webkit-overflow-scrolling: touch;
}
.turn-user {
  align-self: flex-end;
  max-width: 86%;
  background: var(--user-bubble);
  border: 1px solid var(--border-strong);
  color: var(--text);
  padding: 9px 13px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.48;
  white-space: pre-wrap;
  word-break: break-word;
}
.turn-agent {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.thought-block {
  border-radius: 6px;
  overflow: hidden;
}
.thought-summary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
  padding: 2px 0;
}
.thought-chev {
  font-size: 11px;
  transition: transform 0.15s ease;
  display: inline-block;
}
.thought-block.open .thought-chev {
  transform: rotate(90deg);
}
.thought-body {
  display: none;
  margin-top: 6px;
  padding: 8px 12px;
  border-left: 2px solid var(--border-strong);
  color: var(--text-secondary);
  font-size: 12.5px;
  line-height: 1.5;
  white-space: pre-wrap;
}
.thought-block.open .thought-body {
  display: block;
}
.tools-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.tool-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--text-muted);
  font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tool-row svg {
  flex-shrink: 0;
  color: var(--text-muted);
}
.pending-row {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  color: var(--text-muted);
  padding: 2px 0;
}
.pending-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-secondary);
  animation: pulse 1.2s infinite ease-in-out;
}
@keyframes pulse {
  0%, 100% { opacity: 0.25; }
  50% { opacity: 1; }
}
.markdown-body {
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}
.markdown-body > *:first-child { margin-top: 0 !important; }
.markdown-body > *:last-child { margin-bottom: 0 !important; }
.markdown-body p { margin: 0 0 10px 0; }
.markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
  color: #ffffff;
  font-weight: 600;
  margin: 16px 0 8px 0;
  line-height: 1.3;
  letter-spacing: -0.2px;
}
.markdown-body h1 { font-size: 18px; }
.markdown-body h2 { font-size: 16px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
.markdown-body h3 { font-size: 14.5px; }
.markdown-body h4 { font-size: 13.5px; }
.markdown-body ul, .markdown-body ol {
  margin: 0 0 10px 0;
  padding-left: 20px;
}
.markdown-body li { margin-bottom: 4px; }
.markdown-body li > p { margin-bottom: 4px; }
.markdown-body hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 14px 0;
}
.markdown-body blockquote {
  margin: 8px 0 10px 0;
  padding: 6px 12px;
  border-left: 3px solid var(--border-strong);
  background: rgba(255, 255, 255, 0.02);
  color: var(--text-secondary);
  border-radius: 0 6px 6px 0;
}
.markdown-body code {
  font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  font-size: 12.5px;
  background: var(--surface-elevated);
  color: #d8dee9;
  padding: 1.5px 5px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.markdown-body pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 13px;
  overflow-x: auto;
  margin: 8px 0 12px 0;
}
.markdown-body pre code {
  background: transparent;
  border: none;
  padding: 0;
  font-size: 12px;
  line-height: 1.5;
  color: #e6e8ee;
}
.table-wrap {
  width: 100%;
  overflow-x: auto;
  margin: 8px 0 12px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
}
.markdown-body table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
.markdown-body th, .markdown-body td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}
.markdown-body th {
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
}
.markdown-body tr:last-child td {
  border-bottom: none;
}
.markdown-body a {
  color: var(--link);
  text-decoration: none;
}
footer {
  position: relative;
  padding: 6px 12px calc(max(env(safe-area-inset-bottom), 10px)) 12px;
  background: var(--bg);
}
.composer {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  padding: 10px 10px 8px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
textarea {
  width: 100%;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  line-height: 1.45;
  resize: none;
  max-height: 120px;
  outline: none;
  padding: 0;
}
textarea::placeholder {
  color: var(--text-muted);
}
.composer-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.composer-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
}
.model-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--surface-elevated);
  border: 1px solid var(--border-strong);
  color: var(--text);
  font-size: 11.5px;
  font-weight: 500;
  padding: 4px 9px;
  border-radius: 7px;
  cursor: pointer;
}
.model-btn:active {
  opacity: 0.85;
}
.conn-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--text-muted);
}
.conn-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--amber);
}
.conn-pill.online .conn-dot {
  background: var(--green);
}
.model-menu {
  position: absolute;
  bottom: calc(100% + 4px);
  left: 14px;
  background: var(--surface-elevated);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 5px;
  min-width: 220px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
  display: none;
  flex-direction: column;
  gap: 2px;
  z-index: 60;
}
.model-menu.open {
  display: flex;
}
.model-opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: 7px;
  font-size: 12.5px;
  color: var(--text);
  cursor: pointer;
}
.model-opt:active, .model-opt.selected {
  background: rgba(255, 255, 255, 0.08);
}
.model-opt-sub {
  font-size: 10.5px;
  color: var(--text-muted);
}
.send-btn {
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: 7px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
}
/* In-App File Viewer Modal for file:/// links */
#file-modal {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  display: none;
  flex-direction: column;
}
#file-modal.open {
  display: flex;
}
.modal-hdr {
  padding-top: max(env(safe-area-inset-top), 12px);
  padding-bottom: 10px;
  padding-left: 14px;
  padding-right: 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.modal-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  font-family: "SF Mono", "JetBrains Mono", monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}
</style>
</head>
<body>
<header>
  <div class="hdr-left">
    <button class="icon-btn" onclick="toggleDrawer(true)" aria-label="Sidebar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <rect x="2" y="2.5" width="12" height="11" rx="2"/>
        <path d="M6 2.5v11"/>
      </svg>
    </button>
    <span class="session-title" id="hdr-title">iPhone 13 &amp; PC Workspace</span>
  </div>
  <div class="hdr-right">
    <a class="nav-pill" href="nav.html?route=r1&dir=heen&v=5">Cockpit</a>
    <button class="icon-btn" onclick="startNewChatMode()" aria-label="New conversation">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M8 3.2v9.6M3.2 8h9.6"/>
      </svg>
    </button>
  </div>
</header>

<div id="drawer" onclick="if(event.target.id==='drawer')toggleDrawer(false)">
  <div class="drawer-panel">
    <button class="new-conv-btn" onclick="toggleDrawer(false);startNewChatMode()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M8 3v10M3 8h10"/>
      </svg>
      <span>New conversation</span>
    </button>
    <div class="section-label">Recent</div>
    <div class="conv-list" id="conv-list"></div>
  </div>
</div>

<div id="chat"></div>

<div id="file-modal">
  <div class="modal-hdr">
    <span class="modal-title" id="modal-title">file</span>
    <button class="icon-btn" onclick="closeFileModal()" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M4 4l8 8M12 4l-8 8"/>
      </svg>
    </button>
  </div>
  <div class="modal-body markdown-body" id="modal-body"></div>
</div>

<footer>
  <div class="model-menu" id="model-menu">
    <div class="model-opt selected" data-model="argon" onclick="selectModel('argon')">
      <span>Argon</span>
      <span class="model-opt-sub">Default</span>
    </div>
    <div class="model-opt" data-model="pro" onclick="selectModel('pro')">
      <span>Gemini 2.5 Pro</span>
      <span class="model-opt-sub">Pro</span>
    </div>
    <div class="model-opt" data-model="flash" onclick="selectModel('flash')">
      <span>Gemini 2.5 Flash</span>
      <span class="model-opt-sub">Fast</span>
    </div>
    <div class="model-opt" data-model="flash_lite" onclick="selectModel('flash_lite')">
      <span>Gemini 2.5 Flash-Lite</span>
      <span class="model-opt-sub">Lite</span>
    </div>
  </div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask Antigravity..." oninput="this.style.height='auto';this.style.height=(this.scrollHeight)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
    <div class="composer-bar">
      <div class="composer-meta">
        <button class="model-btn" id="model-btn" onclick="toggleModelMenu(event)">
          <span id="model-label">Argon</span>
          <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6l4 4 4-4"/>
          </svg>
        </button>
        <div class="conn-pill" id="conn-pill">
          <span class="conn-dot"></span>
          <span id="conn-text">Offline</span>
        </div>
      </div>
      <button class="send-btn" onclick="sendMessage()" aria-label="Send">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/>
        </svg>
      </button>
    </div>
  </div>
</footer>

<script>
const MODEL_NAMES = {
  argon: "Argon",
  pro: "Gemini 2.5 Pro",
  flash: "Gemini 2.5 Flash",
  flash_lite: "Gemini 2.5 Flash-Lite"
};

let currentConv = localStorage.getItem("agy_cur_conv") || "90a21ecb-1307-4222-821b-4e7ce0c293ba";
let selectedModel = localStorage.getItem("agy_model") || "argon";
let isNewChatMode = false;
let lastRenderSig = "";
let openThoughts = new Set();
let API_BASE = "";
let pcOnline = false;
let consecutiveFailures = 0;

if (window.marked) {
  marked.setOptions({ gfm: true, breaks: true });
}

function setConnStatus(online, modeText) {
  pcOnline = online;
  const pill = document.getElementById("conn-pill");
  const txt = document.getElementById("conn-text");
  pill.classList.toggle("online", online);
  txt.textContent = modeText;
}

async function resolveApiBase() {
  try {
    const r = await fetch("/api/conversations", {signal: AbortSignal.timeout(1500)});
    if (r.ok) {
      API_BASE = "";
      consecutiveFailures = 0;
      setConnStatus(true, "Wi-Fi");
      return;
    }
  } catch (e) {}
  try {
    const g = await fetch("https://api.github.com/gists/4277208e57b4f464f51d026fbd7a730a", {cache: "no-store"});
    const gj = await g.json();
    const info = JSON.parse(gj.files["agy_endpoint.json"].content);
    if (info.tunnel_url) {
      const ping = await fetch(info.tunnel_url + "/api/conversations", {signal: AbortSignal.timeout(3500)});
      if (ping.ok) {
        API_BASE = info.tunnel_url;
        consecutiveFailures = 0;
        setConnStatus(true, "5G");
        return;
      }
    }
  } catch (e) {}
  setConnStatus(false, "Cache");
}

function toggleModelMenu(e) {
  e.stopPropagation();
  document.getElementById("model-menu").classList.toggle("open");
}

document.addEventListener("click", () => {
  const m = document.getElementById("model-menu");
  if (m) m.classList.remove("open");
});

async function selectModel(modelKey) {
  if (!MODEL_NAMES[modelKey]) modelKey = "argon";
  selectedModel = modelKey;
  localStorage.setItem("agy_model", modelKey);
  document.getElementById("model-label").textContent = MODEL_NAMES[modelKey];
  document.querySelectorAll(".model-opt").forEach(el => {
    el.classList.toggle("selected", el.getAttribute("data-model") === modelKey);
  });
  document.getElementById("model-menu").classList.remove("open");
  if (pcOnline) {
    try {
      await fetch(API_BASE + "/api/model", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({model: modelKey})
      });
    } catch (e) {}
  }
}

async function syncModelFromPc() {
  selectModel(selectedModel);
  if (!pcOnline) return;
  try {
    const r = await fetch(API_BASE + "/api/model");
    if (r.ok) {
      const data = await r.json();
      if (data.model && MODEL_NAMES[data.model]) {
        selectedModel = data.model;
        localStorage.setItem("agy_model", selectedModel);
        selectModel(selectedModel);
      }
    }
  } catch (e) {}
}

function toggleDrawer(open) {
  const d = document.getElementById("drawer");
  if (open) { d.classList.add("open"); loadConversations(); }
  else d.classList.remove("open");
}

function renderConversationList(list) {
  const el = document.getElementById("conv-list");
  el.innerHTML = "";
  list.forEach(c => {
    const div = document.createElement("div");
    div.className = "conv-item" + (!isNewChatMode && c.id === currentConv ? " active" : "");
    div.onclick = () => {
      isNewChatMode = false;
      currentConv = c.id;
      localStorage.setItem("agy_cur_conv", currentConv);
      lastRenderSig = "";
      document.getElementById("hdr-title").textContent = c.title;
      toggleDrawer(false);
      loadMessages(true);
    };
    div.innerHTML = `<div class="conv-title">${escapeHtml(c.title)}</div>
      <div class="conv-meta"><span>${c.steps} steps</span><span>${c.updated_str}</span></div>`;
    el.appendChild(div);
  });
}

async function loadConversations() {
  try {
    const r = await fetch(API_BASE + "/api/conversations", {signal: AbortSignal.timeout(4000)});
    if (!r.ok) throw new Error("offline");
    const list = await r.json();
    localStorage.setItem("agy_cache_convs", JSON.stringify(list));
    renderConversationList(list);
    consecutiveFailures = 0;
    if (!pcOnline) setConnStatus(true, API_BASE ? "5G" : "Wi-Fi");
  } catch (e) {
    const cached = localStorage.getItem("agy_cache_convs");
    if (cached) {
      try { renderConversationList(JSON.parse(cached)); } catch (err) {}
    }
  }
}

function escapeHtml(s) {
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderMarkdown(md) {
  if (!md) return "";
  if (window.marked) {
    let html = marked.parse(md);
    html = html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '</table></div>');
    return html;
  }
  let out = escapeHtml(md);
  out = out.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
  out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return out.replace(/\n/g, "<br>");
}

function computePayloadSig(msgs) {
  if (!msgs || !msgs.length) return "0";
  const last = msgs[msgs.length - 1];
  const tLen = (last.tools && last.tools.length) ? last.tools.length : 0;
  const cLen = (last.content || "").length;
  const thLen = (last.thinking || "").length;
  return `${msgs.length}:${last.step}:${last.role}:${tLen}:${cLen}:${thLen}`;
}

function toggleThoughtBlock(stepKey, el) {
  el.classList.toggle("open");
  if (el.classList.contains("open")) {
    openThoughts.add(stepKey);
  } else {
    openThoughts.delete(stepKey);
  }
}

function renderTurnsToDOM(msgs, forceScroll) {
  const chat = document.getElementById("chat");
  const wasAtBottom = (chat.scrollHeight - chat.scrollTop - chat.clientHeight) < 95;
  const prevScrollTop = chat.scrollTop;

  chat.innerHTML = "";
  msgs.forEach((m, idx) => {
    const div = document.createElement("div");
    const stepKey = String(m.step || idx);
    if (m.role === "user") {
      div.className = "turn-user";
      div.textContent = m.content;
    } else {
      div.className = "turn-agent";
      let inner = "";
      const tCount = (m.tools && m.tools.length) ? m.tools.length : 0;
      if (m.thinking || tCount > 0) {
        const isOpen = openThoughts.has(stepKey) ? " open" : "";
        const label = tCount > 0 ? `Thought · ${tCount} ${tCount === 1 ? 'action' : 'actions'}` : `Thought`;
        const toolsHtml = tCount > 0 ? (`<div class="tools-list" style="margin-bottom:8px;">` + m.tools.map(t => `<div class="tool-row">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-6.5"/></svg>
          <span>${escapeHtml(t)}</span>
        </div>`).join("") + `</div>`) : "";
        inner += `<div class="thought-block${isOpen}" onclick="toggleThoughtBlock('${stepKey}', this)">
          <div class="thought-summary"><span class="thought-chev">›</span><span>${label}</span></div>
          <div class="thought-body">${toolsHtml}${escapeHtml(m.thinking || "")}</div>
        </div>`;
      }
      if (!m.content && tCount > 0) {
        const recentTools = m.tools.slice(-2);
        inner += `<div class="tools-list">` + recentTools.map(t => `<div class="tool-row">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-6.5"/></svg>
          <span>${escapeHtml(t)}</span>
        </div>`).join("") + `</div>`;
      }
      if (m.content) {
        inner += `<div class="markdown-body">${renderMarkdown(m.content)}</div>`;
      }
      div.innerHTML = inner;
    }
    chat.appendChild(div);
  });

  // If the last message in the thread is from the user (or an agent turn still without final content), show subtle live pulse
  if (msgs.length > 0 && pcOnline) {
    const last = msgs[msgs.length - 1];
    if (last.role === "user" || (last.role === "agent" && !last.content)) {
      const pDiv = document.createElement("div");
      pDiv.className = "pending-row";
      pDiv.innerHTML = `<span class="pending-dot"></span><span>Working...</span>`;
      chat.appendChild(pDiv);
    }
  }

  if (forceScroll || wasAtBottom) {
    chat.scrollTop = chat.scrollHeight;
  } else {
    chat.scrollTop = prevScrollTop;
  }
}

// Intercept file:/// links in markdown responses so they open cleanly on iPhone
document.getElementById("chat").addEventListener("click", async (e) => {
  const a = e.target.closest("a");
  if (!a) return;
  const href = a.getAttribute("href") || "";
  if (href.startsWith("file:///")) {
    e.preventDefault();
    let rawPath = decodeURIComponent(href.replace(/^file:\/\/\//, "")).replace(/#.*$/, "");
    openFileModal(rawPath);
  }
});

async function openFileModal(filePath) {
  const modal = document.getElementById("file-modal");
  const titleEl = document.getElementById("modal-title");
  const bodyEl = document.getElementById("modal-body");
  const baseName = filePath.split(/[\\/]/).pop() || filePath;
  titleEl.textContent = baseName;
  bodyEl.innerHTML = `<div class="pending-row"><span class="pending-dot"></span><span>Loading...</span></div>`;
  modal.classList.add("open");

  try {
    const r = await fetch(API_BASE + "/api/file?path=" + encodeURIComponent(filePath));
    if (!r.ok) throw new Error("not found");
    const data = await r.json();
    if (baseName.toLowerCase().endsWith(".md")) {
      bodyEl.innerHTML = renderMarkdown(data.content || "");
    } else {
      bodyEl.innerHTML = `<pre><code>${escapeHtml(data.content || "")}</code></pre>`;
    }
  } catch (err) {
    bodyEl.innerHTML = `<pre><code>${escapeHtml(filePath)}</code></pre>`;
  }
}

function closeFileModal() {
  document.getElementById("file-modal").classList.remove("open");
}

async function loadMessages(forceScroll) {
  if (isNewChatMode) return;
  try {
    const r = await fetch(API_BASE + "/api/messages?id=" + encodeURIComponent(currentConv), {signal: AbortSignal.timeout(4000)});
    if (!r.ok) throw new Error("offline");
    const msgs = await r.json();
    localStorage.setItem("agy_cache_msgs_" + currentConv, JSON.stringify(msgs));
    consecutiveFailures = 0;
    if (!pcOnline) setConnStatus(true, API_BASE ? "5G" : "Wi-Fi");

    const sig = computePayloadSig(msgs);
    if (!forceScroll && sig === lastRenderSig) return;
    lastRenderSig = sig;
    renderTurnsToDOM(msgs, forceScroll);
  } catch (e) {
    consecutiveFailures++;
    if (consecutiveFailures === 2) {
      resolveApiBase();
    } else if (consecutiveFailures >= 3) {
      setConnStatus(false, "Cache");
    }
    if (forceScroll || !lastRenderSig) {
      const cached = localStorage.getItem("agy_cache_msgs_" + currentConv);
      if (cached) {
        try {
          const msgs = JSON.parse(cached);
          lastRenderSig = computePayloadSig(msgs);
          renderTurnsToDOM(msgs, true);
        } catch (err) {}
      }
    }
  }
}

function startNewChatMode() {
  isNewChatMode = true;
  lastRenderSig = "";
  document.getElementById("hdr-title").textContent = "New Conversation";
  document.getElementById("chat").innerHTML = "";
  const inp = document.getElementById("input");
  inp.value = "";
  inp.focus();
}

async function sendMessage() {
  const inp = document.getElementById("input");
  const text = inp.value.trim();
  if (!text) return;
  if (!pcOnline) {
    await resolveApiBase();
    if (!pcOnline) return;
  }
  inp.value = "";
  inp.style.height = "auto";
  const chat = document.getElementById("chat");
  if (isNewChatMode) {
    chat.innerHTML = "";
  }
  const div = document.createElement("div");
  div.className = "turn-user";
  div.textContent = text;
  chat.appendChild(div);

  const pDiv = document.createElement("div");
  pDiv.className = "pending-row";
  pDiv.innerHTML = `<span class="pending-dot"></span><span>Working...</span>`;
  chat.appendChild(pDiv);
  chat.scrollTop = chat.scrollHeight;

  if (isNewChatMode) {
    isNewChatMode = false;
    document.getElementById("hdr-title").textContent = text.slice(0, 42);
    const r = await fetch(API_BASE + "/api/new", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({prompt: text, model: selectedModel})
    });
    const res = await r.json();
    if (res.conversation_id) {
      currentConv = res.conversation_id;
      localStorage.setItem("agy_cur_conv", currentConv);
      lastRenderSig = "";
      setTimeout(() => { loadConversations(); loadMessages(true); }, 900);
    }
  } else {
    await fetch(API_BASE + "/api/send", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: currentConv, content: text})
    });
    setTimeout(() => loadMessages(true), 700);
  }
}

(async () => {
  await resolveApiBase();
  await syncModelFromPc();
  loadConversations();
  loadMessages(true);
  setInterval(() => loadMessages(false), 2000);
})();
</script>
